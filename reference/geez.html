<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in Ge'ez Ethiopic numerals. The hour, minute and second are stacked in three rows, each written with the traditional bar-topped numeral glyphs on parchment. The exact time is shown beside each row and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);

  var INK = 'rgba(48,34,16,0.94)';
  var LABEL = ['HOURS', 'MINUTES', 'SECONDS'];

  // --------------------------------------------------------------------------
  // GE'EZ / ETHIOPIC NUMERALS. Each numeral is a distinct bar-topped glyph:
  //   ones 1..9 = U+1369..U+1371, tens 10..50 = U+1372..U+1376.
  // Decimal-additive in this range: tens glyph then ones glyph (e.g. 47 = 40 7).
  // There is no zero glyph; a small bare mark stands in for it.
  // --------------------------------------------------------------------------
  var ONES = ['', '፩','፪','፫','፬','፭','፮','፯','፰','፱'];
  var TENS = ['', '፲','፳','፴','፵','፶'];
  function toGeez(n) {
    if (n === 0) return '○';                 // no Ge'ez zero; faded ring stands in
    var t = Math.floor(n / 10), u = n % 10;
    return (TENS[t] || '') + (ONES[u] || '');
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // --------------------------------------------------------------------------
  // CANVAS SIZING (DPR-aware)
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  var lastSR = -1;

  function paint() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#e8d6a3');
    g.addColorStop(1, '#d3bd82');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function tick() {
    var now = new Date();
    var vals = [now.getHours(), now.getMinutes(), now.getSeconds()];

    paint();

    // Ge'ez reads left-to-right within each numeral; only the H/M/S group
    // layout adapts to the screen.
    if (H > W * 1.05) {
      // PORTRAIT: three numerals stacked, read top to bottom (H, M, S).
      var rowGap = Math.min(H * 0.27, W * 0.62);
      var cy0 = H / 2 - rowGap;
      var px = Math.max(26, Math.min(rowGap * 0.7, W * 0.26));
      for (var i = 0; i < 3; i++) {
        var cy = cy0 + i * rowGap;
        var cx = embedded ? W / 2 : W * 0.42;
        ctx.fillStyle = vals[i] === 0 ? 'rgba(54,40,24,0.34)' : INK;
        ctx.font = '700 ' + Math.round(px) + 'px "Noto Serif Ethiopic", serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(toGeez(vals[i]), cx, cy);
        if (!embedded) {
          ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
          var dpx = Math.max(12, Math.round(px * 0.26));
          ctx.font = '600 ' + dpx + 'px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgba(31,122,77,0.9)';
          ctx.fillText(pad2(vals[i]), W * 0.94, cy - dpx * 0.55);
          ctx.fillStyle = 'rgba(48,34,16,0.45)';
          ctx.font = '600 ' + Math.round(dpx * 0.58) + 'px "JetBrains Mono", monospace';
          ctx.fillText(LABEL[i], W * 0.94, cy + dpx * 0.58);
        }
      }
    } else {
      // LANDSCAPE (e.g. Apple TV): three numerals across one row, H · M · S,
      // each still read left-to-right.
      var colW = W / 3;
      var lpx = Math.max(28, Math.min(H * 0.38, colW * 0.5));
      var lcy = H / 2 - (embedded ? 0 : lpx * 0.16);
      for (var j = 0; j < 3; j++) {
        var lcx = colW * (j + 0.5);
        ctx.fillStyle = vals[j] === 0 ? 'rgba(54,40,24,0.34)' : INK;
        ctx.font = '700 ' + Math.round(lpx) + 'px "Noto Serif Ethiopic", serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(toGeez(vals[j]), lcx, lcy);
        if (!embedded) {
          var ldpx = Math.max(12, Math.round(lpx * 0.2));
          ctx.font = '600 ' + ldpx + 'px "JetBrains Mono", monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillStyle = 'rgba(31,122,77,0.9)';
          ctx.fillText(LABEL[j] + ' ' + pad2(vals[j]), lcx, lcy + lpx * 0.5);
        }
      }
    }

    if (now.getMinutes() !== lastSR) {
      lastSR = now.getMinutes();
      sr.textContent = pad2(vals[0]) + ':' + pad2(vals[1]) + ' local time, in Ge’ez numerals.';
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  resize();
  start();
})();
</script>
<script>window.aboutClock = {
  title: 'Ge’ez Numerals',
  board: { label: 'Ciphers', href: '/clocks/numerals/' },
  body: '<p>Ge&rsquo;ez (Ethiopic) numerals have distinct glyphs for the ones and for the tens, each with a small bar like a cap and a foot. '
      + 'To write 47 you place the forty sign before the seven sign, and there is no true zero glyph, so this clock uses a faint stand in mark for 00. Hours, minutes, and seconds are stacked as three lines, like a page of parchment.</p>'
      + '<p>Ethiopia kept its own numerals and its own calendar, which currently runs a few years behind ours, so by that reckoning you have plenty of time.</p>'
      + '<p class="about-map">Source: <a href="https://en.wikipedia.org/wiki/Ge%27ez_numerals" target="_blank" rel="noopener">Wikipedia</a>.</p>'
};</script>
