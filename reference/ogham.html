<body>
  <canvas id="scene" role="img"
    aria-label="The current local time written in Ogham strokes, carved up a single tall column and read from the bottom up: hours at the bottom, minutes in the middle, seconds at the top. Each group carries two Ogham digits, read from the bottom up: strokes to the right of the stem count one to five, diagonal strokes crossing the stem count six to nine, and a bare ringed gap is zero. The exact time is shown beside each group and announced."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');

  var ACCENT = '#9ad94f';

  // --------------------------------------------------------------------------
  // CANVAS SIZING (DPR-aware)
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // --------------------------------------------------------------------------
  // ONE OGHAM DIGIT-CELL  (value 0..9), drawn against a vertical stem at cx.
  // The cell owns a fixed-height slot [top, top+slotH]; strokes are centred in
  // it so changing values never shift the digit.
  //   1..5  -> that many horizontal strokes to the RIGHT of the stem
  //            (the aicme Beithe family: strokes on one side of the line)
  //   6..9  -> 1..4 diagonal strokes CROSSING the stem, leaning up-to-the-right
  //            (the aicme Muine family: angled strokes across the line)
  //   0     -> a bare stem segment marked with a small open ring (a clear gap)
  // Strokes within a digit are laid from the bottom of the slot upward, matching
  // the traditional bottom-to-top reading direction.
  // --------------------------------------------------------------------------
  function drawDigit(cx, top, slotH, unit, d) {
    var armLen = unit * 0.92;          // length of a side stroke (right of stem)
    var crossHalf = unit * 0.66;       // half-length of a crossing diagonal
    var crossRise = unit * 0.46;       // vertical rise of a crossing diagonal
    var lw = Math.max(2.4, unit * 0.16);

    ctx.save();
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(154,217,79,0.55)';
    ctx.shadowBlur = Math.max(6, unit * 0.5);

    if (d === 0) {
      // zero: an open ring centred on the stem, marking a deliberate gap
      var ry = top + slotH / 2;
      var rad = unit * 0.42;
      ctx.lineWidth = Math.max(2, unit * 0.12);
      ctx.beginPath();
      ctx.arc(cx, ry, rad, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      return;
    }

    // how many strokes, and their spacing within the slot
    var n = (d <= 5) ? d : (d - 5);
    var span = slotH * 0.80;                       // vertical room for the strokes
    var stepGap = (n > 1) ? span / (n - 1) : 0;
    var firstY = top + slotH / 2 + span / 2;       // bottom-most stroke
    if (n === 1) firstY = top + slotH / 2;

    for (var i = 0; i < n; i++) {
      var y = (n === 1) ? firstY : (firstY - i * stepGap);
      if (d <= 5) {
        // strokes to the RIGHT of the stem
        ctx.beginPath();
        ctx.moveTo(cx, y);
        ctx.lineTo(cx + armLen, y);
        ctx.stroke();
      } else {
        // diagonal strokes CROSSING the stem (lower-left to upper-right)
        ctx.beginPath();
        ctx.moveTo(cx - crossHalf, y + crossRise / 2);
        ctx.lineTo(cx + crossHalf, y - crossRise / 2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // --------------------------------------------------------------------------
  // RENDER
  // --------------------------------------------------------------------------
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  var lastSR = -1;

  // One H/M/S group: a vertical stem carrying two Ogham digit slots (tens in the
  // upper slot, units in the lower), so each stem reads BOTTOM TO TOP — Ogham's
  // own carved-up-the-edge convention, kept fixed in both orientations.
  function drawStem(cx, groupTop, groupH, slotH, unit, stemPad, val) {
    var tens = Math.floor(val / 10), units = val % 10;
    ctx.save();
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = Math.max(2, unit * 0.12);
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(154,217,79,0.40)';
    ctx.shadowBlur = Math.max(4, unit * 0.35);
    ctx.beginPath();
    ctx.moveTo(cx, groupTop);
    ctx.lineTo(cx, groupTop + groupH);
    ctx.stroke();
    ctx.restore();
    drawDigit(cx, groupTop + stemPad, slotH, unit, tens);
    drawDigit(cx, groupTop + stemPad + slotH, slotH, unit, units);
  }

  function tick() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();

    ctx.clearRect(0, 0, W, H);

    var standalone = (window.self === window.top);
    var landscape = W > H;

    // index 0 = Hours, 1 = Minutes, 2 = Seconds. The Ogham reading direction
    // (bottom-to-top per stem) never changes; only how the three groups arrange
    // to fill the screen does.
    var groups = [
      { tag: 'H', val: h },
      { tag: 'M', val: m },
      { tag: 'S', val: s }
    ];

    if (landscape) {
      // LANDSCAPE (e.g. Apple TV): three parallel stems side by side, H | M | S,
      // each still read bottom-to-top. Fills the wide screen instead of leaving
      // a lonely tall column in a black field.
      var slotH = Math.min(H * 0.30, W * 0.12, 120);
      var unit = Math.min(slotH * 0.43, W * 0.06, 52);
      var stemPad = unit * 0.7;
      var groupH = 2 * slotH + 2 * stemPad;
      var armLen = unit * 0.92;
      var tagPx = Math.max(12, Math.round(unit * 0.6));
      var labelRoom = standalone ? unit * 1.6 : 0;
      var stemTop = H / 2 - (groupH + labelRoom) / 2;
      var colW = W / 3;
      for (var c = 0; c < 3; c++) {
        // strokes hang RIGHT of the stem, so nudge each stem left of its column
        // centre to keep the inked mass balanced.
        var cx = colW * (c + 0.5) - armLen * 0.5;
        drawStem(cx, stemTop, groupH, slotH, unit, stemPad, groups[c].val);
        if (standalone) {
          ctx.save();
          ctx.fillStyle = 'rgba(245,180,65,0.66)';
          ctx.font = '600 ' + tagPx + 'px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText(groups[c].tag + ' ' + pad2(groups[c].val),
                       colW * (c + 0.5), stemTop + groupH + unit * 0.7);
          ctx.restore();
        }
      }
    } else {
      // PORTRAIT (e.g. phone): one tall column read BOTTOM TO TOP — Hours lowest,
      // Minutes middle, Seconds highest. Sized to the viewport HEIGHT so it stays
      // tall. Each group carries two Ogham digits (units below tens).
      var slotH = Math.min(H * 0.115, W * 0.16, 92);
      var unit = Math.min(slotH * 0.43, W * 0.07, 46);
      var stemPad = unit * 0.7;
      var groupH = 2 * slotH + 2 * stemPad;
      var groupGap = Math.min(H * 0.045, unit * 1.6);
      var totalH = 3 * groupH + 2 * groupGap;
      var armLen = unit * 0.92;
      var tagPx = Math.max(12, Math.round(unit * 0.62));
      // Nudge the stem left so the right-hand strokes (and standalone labels)
      // balance: a small shift embedded, a larger one standalone for the labels.
      var cx = standalone ? (W / 2 - unit * 1.7) : (W / 2 - armLen * 0.5);
      var colTop = H / 2 - totalH / 2;
      for (var p = 0; p < 3; p++) {
        // laid top-to-bottom on the canvas as S, M, H so that, read from the
        // bottom up, the order is H, M, S.
        var groupTop = colTop + (2 - p) * (groupH + groupGap);
        drawStem(cx, groupTop, groupH, slotH, unit, stemPad, groups[p].val);
        if (standalone) {
          ctx.save();
          ctx.fillStyle = 'rgba(245,180,65,0.66)';
          ctx.font = '600 ' + tagPx + 'px "JetBrains Mono", monospace';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(groups[p].tag + ' ' + pad2(groups[p].val),
                       cx + unit * 2.2, groupTop + groupH / 2);
          ctx.restore();
        }
      }
    }

    if (m !== lastSR) {
      lastSR = m;
      sr.textContent = pad2(h) + ':' + pad2(m) +
        ' local time, written in Ogham strokes.';
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  // The reading key lives in the "?" modal now, so there is no on-canvas legend.

  resize();
  start();
})();
</script>

  body: '<p>Ogham letters are strokes cut along a central stem line, meant to be read up the edge of a stone. '
      + 'This clock borrows that stroke vocabulary to write digits, with side strokes and crossing strokes for 1 through 9 and a small ring for zero. Hours, minutes, and seconds stack on one tall column, each shown as two digits on its own stem.</p>'
      + '<p>Ogham was carved up the edges of standing stones, making it the only script designed to be read by tripping over it.</p>'
      + '<p class="about-map">Source: <a href="https://en.wikipedia.org/wiki/Ogham" target="_blank" rel="noopener">Wikipedia</a>.</p>'
};</script>
