<body>
  <canvas id="scene" role="img"
    aria-label="The current local time written in Kaktovik Iñupiaq base-twenty numerals, drawn as hand-inked glyphs for hours, minutes and seconds. The exact 24-hour time is shown below and announced."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');

  var CYAN = '#52e0a6';
  var AMBER = '#8fd4ff';

  // --------------------------------------------------------------------------
  // KAKTOVIK GLYPH GEOMETRY
  // A single base-20 digit d (0..19) sits in one normalised cell of width 1,
  // height 1, origin top-left. It is the sum of:
  //   fives = floor(d/5)  (0..3)  -> that many wide chevrons (value 5 each)
  //                                  stacked from the BOTTOM, growing up.
  //   ones  = d % 5       (0..4)  -> that many short strokes across the TOP,
  //                                  spaced left-to-right (value 1 each).
  // Zero is a distinct mark: a small "crossed-arms" double stroke, centred.
  // Everything is drawn in cell-local coords [0,1]x[0,1]; the caller maps the
  // cell onto the canvas with a scale and offset.
  // --------------------------------------------------------------------------
  function drawDigit(ox, oy, cell, d, lw) {
    var fives = Math.floor(d / 5);
    var ones = d % 5;

    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    function lx(u) { return ox + u * cell; }
    function ly(v) { return oy + v * cell; }

    if (d === 0) {
      // crossed-arms zero: two short strokes meeting near the centre
      ctx.beginPath();
      ctx.moveTo(lx(0.28), ly(0.42));
      ctx.lineTo(lx(0.72), ly(0.60));
      ctx.moveTo(lx(0.72), ly(0.42));
      ctx.lineTo(lx(0.28), ly(0.60));
      ctx.stroke();
      return;
    }

    // ----- ones: short vertical-ish strokes across the TOP band -----
    if (ones > 0) {
      // top band runs y in [0.08, 0.40]; strokes lean slightly for an inked feel
      var topY0 = 0.10, topY1 = 0.40;
      // centre `ones` strokes within the cell width, with margins
      var marginX = 0.24;
      var span = 1 - 2 * marginX;
      ctx.beginPath();
      for (var i = 0; i < ones; i++) {
        // even spacing; single stroke sits centred
        var t = ones === 1 ? 0.5 : (i / (ones - 1));
        var cx = marginX + t * span;
        // slight lean to the right for a hand-drawn slash
        ctx.moveTo(lx(cx - 0.045), ly(topY1));
        ctx.lineTo(lx(cx + 0.045), ly(topY0));
      }
      ctx.stroke();
    }

    // ----- fives: wide chevrons stacked from the BOTTOM, growing up -----
    if (fives > 0) {
      // chevron band runs y in [0.48, 0.96]; each chevron occupies a slice
      var bandTop = 0.50, bandBottom = 0.96;
      var bandH = bandBottom - bandTop;
      var slice = bandH / fives;
      var chW = 0.74;          // chevron width fraction
      var x0 = (1 - chW) / 2;
      var x1 = x0 + chW;
      var xm = 0.5;
      var dip = slice * 0.62;  // how deep the V dips within its slice
      ctx.beginPath();
      for (var k = 0; k < fives; k++) {
        // bottom-most chevron first; topV is the slice's upper edge
        var sliceTop = bandTop + k * slice;
        var armTop = sliceTop + (slice - dip) * 0.5;
        var vBot = armTop + dip;
        ctx.moveTo(lx(x0), ly(armTop));
        ctx.lineTo(lx(xm), ly(vBot));
        ctx.lineTo(lx(x1), ly(armTop));
      }
      ctx.stroke();
    }
  }

  // --------------------------------------------------------------------------
  // CANVAS SIZING
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // --------------------------------------------------------------------------
  // RENDER
  // --------------------------------------------------------------------------
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // draw a base-20 value (0..59) as two cells: twenties digit then ones digit,
  // left-to-right, returning the total width drawn. centred vertically on cy.
  function drawGroup(centerX, cy, value, cell, gapCells, lw) {
    var twenties = Math.floor(value / 20); // 0..2
    var ones = value % 20;                  // 0..19

    var gap = cell * gapCells;
    var groupW = cell * 2 + gap;
    var x0 = centerX - groupW / 2;
    var oy = cy - cell / 2;

    drawDigit(x0, oy, cell, twenties, lw);
    drawDigit(x0 + cell + gap, oy, cell, ones, lw);

    return groupW;
  }

  var lastSR = -1;

  function tick() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();

    ctx.clearRect(0, 0, W, H);

    var embedded = (window.self !== window.top);
    var vals = [h, m, s];
    var LABEL = ['HOURS', 'MINUTES', 'SECONDS'];
    var innerGap = 0.16;   // gap between the two cells of a group, in cells

    // Kaktovik reads left-to-right within each group (twenties cell, ones cell);
    // only the H/M/S group layout adapts. Build per-group centres + cell size.
    var cell, lw, centers, labelBelow;
    if (H > W * 1.05) {
      // PORTRAIT: three groups stack as rows.
      var cellByW = (W * 0.6) / (2 + innerGap);
      var cellByH = (H * 0.8) / 3.6;     // three rows + label headroom
      cell = Math.min(cellByW, cellByH, 180);
      var rowGap = cell * 1.18;
      var cy0 = H / 2 - rowGap;
      var cx = embedded ? W / 2 : W * 0.4;
      centers = [{ x: cx, y: cy0 }, { x: cx, y: cy0 + rowGap }, { x: cx, y: cy0 + 2 * rowGap }];
      lw = Math.max(2.5, cell * 0.05);
      labelBelow = false;
    } else {
      // LANDSCAPE (e.g. Apple TV): three groups across, H | M | S.
      var colW = W / 3;
      var cellByW = (colW * 0.78) / (2 + innerGap);
      var cellByH = H * 0.42;
      cell = Math.min(cellByW, cellByH, 200);
      var cy = H / 2 - (embedded ? 0 : cell * 0.45);
      centers = [{ x: colW * 0.5, y: cy }, { x: colW * 1.5, y: cy }, { x: colW * 2.5, y: cy }];
      lw = Math.max(2.5, cell * 0.05);
      labelBelow = true;
    }

    ctx.save();
    ctx.strokeStyle = CYAN;
    ctx.fillStyle = CYAN;
    ctx.shadowColor = 'rgba(82,224,166,0.55)';
    ctx.shadowBlur = Math.max(6, cell * 0.10);
    for (var i = 0; i < 3; i++) drawGroup(centers[i].x, centers[i].y, vals[i], cell, innerGap, lw);
    ctx.restore();

    // plain value + unit label (standalone only)
    if (!embedded) {
      var dpx = Math.max(13, Math.round(cell * (labelBelow ? 0.26 : 0.34)));
      ctx.save();
      ctx.shadowBlur = 0;
      for (var r = 0; r < 3; r++) {
        if (labelBelow) {
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillStyle = 'rgba(245,180,65,0.78)';
          ctx.font = '600 ' + dpx + 'px "JetBrains Mono", monospace';
          ctx.fillText(['H', 'M', 'S'][r] + ' ' + pad2(vals[r]), centers[r].x, centers[r].y + cell * 0.62);
        } else {
          ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
          var ry = centers[r].y;
          ctx.fillStyle = 'rgba(245,180,65,0.78)';
          ctx.font = '600 ' + dpx + 'px "JetBrains Mono", monospace';
          ctx.fillText(pad2(vals[r]), W * 0.93, ry - dpx * 0.5);
          ctx.fillStyle = 'rgba(224,240,250,0.4)';
          ctx.font = '600 ' + Math.round(dpx * 0.52) + 'px "JetBrains Mono", monospace';
          ctx.fillText(LABEL[r], W * 0.93, ry + dpx * 0.55);
        }
      }
      ctx.restore();
    }

    announce(h, m, s);
  }

  function numWord(n) {
    return pad2(n);
  }

  function announce(h, m, s) {
    if (m === lastSR) return;
    lastSR = m;
    sr.textContent = numWord(h) + ':' + numWord(m) +
      ' local time, in Kaktovik base-twenty numerals.';
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  // brief read-it caption: shown on load, again on tap or key, fading after a pause
  var legend = document.getElementById('legend');
  var legendTimer = null;
  function flashLegend() {
    if (!legend) return;
    legend.classList.add('show');
    if (legendTimer) clearTimeout(legendTimer);
    legendTimer = setTimeout(function () { legend.classList.remove('show'); }, 5000);
  }
  document.addEventListener('pointerup', function (e) {
    if (e.target.closest && e.target.closest('a')) return;
    flashLegend();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flashLegend(); }
  });
  if (window.self === window.top) flashLegend();  // standalone only, not in gallery embeds

  resize();
  start();
})();
</script>

      + 'Chevrons are fives, short strokes are ones, and the shapes combine to cover 0 through 19. Each row shows a value as two base 20 digits (twenties, then ones) for hours, minutes, and seconds.</p>'
      + '<p>These were invented in the 1990s by Alaskan students who were fed up with base ten, which is the most justified reason to build a number system I have ever heard.</p>'

};</script>
