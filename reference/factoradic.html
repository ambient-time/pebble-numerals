<style>

  :root { --accent: #f2b441; --bg: #0d0a06; --bg2: #181208; --ink: rgba(250,240,222,0.86); }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Atkinson Hyperlegible', ui-sans-serif, system-ui, -apple-system, sans-serif; }

<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in the factorial number base. Hours, minutes and seconds are each written as four digits whose place values are the factorials 24, 6, 2 and 1, and every digit is shown as a small stack of dots. The exact time is shown beside each row and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);

  var ON = '#f2b441', GLOW = 'rgba(242,180,65,0.7)';
  var LABEL = ['HOURS', 'MINUTES', 'SECONDS'];
  var WEIGHTS = [24, 6, 2, 1];                    // 4! 3! 2! 1!, MSB..LSB

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // factoradic digits for places 1..4 (weights 1,2,6,24), returned MSB-first
  function toFact(n) {
    var d = [];
    for (var k = 1; k <= 4; k++) { d.push(n % (k + 1)); n = Math.floor(n / (k + 1)); }
    return d.reverse();                           // [d24, d6, d2, d1]
  }

  // --------------------------------------------------------------------------
  // CANVAS SIZING (DPR-aware)
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  var lastSR = -1;

  function tick() {
    var now = new Date();
    var vals = [now.getHours(), now.getMinutes(), now.getSeconds()];

    ctx.fillStyle = '#0d0a06'; ctx.fillRect(0, 0, W, H);

    var rowGap = Math.min(H * 0.26, W * 0.5);
    var cy0 = H / 2 - rowGap;
    var colPitch = Math.min(W * (embedded ? 0.2 : 0.16), rowGap * 0.9);
    var dotR = colPitch * 0.17;
    var blockW = 3 * colPitch;
    var cx0 = (embedded ? W / 2 : W * 0.42) - blockW / 2;

    // column weight labels along the top
    ctx.fillStyle = 'rgba(242,180,65,0.4)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var wl = Math.max(10, Math.round(dotR * 1.5));
    ctx.font = '600 ' + wl + 'px "JetBrains Mono", monospace';
    for (var c = 0; c < 4; c++) ctx.fillText(WEIGHTS[c], cx0 + c * colPitch, cy0 - rowGap * 0.5);

    for (var rr = 0; rr < 3; rr++) {
      var cy = cy0 + rr * rowGap;
      var digs = toFact(vals[rr]);
      for (var c2 = 0; c2 < 4; c2++) {
        var cx = cx0 + c2 * colPitch;
        var dgt = digs[c2];
        // a faint frame slot, then `dgt` glowing dots stacked upward from the baseline
        ctx.strokeStyle = 'rgba(242,180,65,0.14)'; ctx.lineWidth = 1.2;
        ctx.strokeRect(cx - dotR * 1.5, cy - dotR * 4.4, dotR * 3, dotR * 8.8);
        for (var k = 0; k < dgt; k++) {
          var dy = cy + dotR * 3.2 - k * dotR * 2.5;
          ctx.save();
          ctx.fillStyle = ON; ctx.shadowColor = GLOW; ctx.shadowBlur = dotR * 1.3;
          ctx.beginPath(); ctx.arc(cx, dy, dotR, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      }
      if (!embedded) {
        ctx.fillStyle = 'rgba(242,180,65,0.78)';
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        var dpx = Math.max(13, Math.round(colPitch * 0.3));
        ctx.font = '600 ' + dpx + 'px "JetBrains Mono", monospace';
        ctx.fillText(pad2(vals[rr]), W * 0.95, cy - dpx * 0.5);
        ctx.fillStyle = 'rgba(250,240,222,0.4)';
        ctx.font = '600 ' + Math.round(dpx * 0.52) + 'px "JetBrains Mono", monospace';
        ctx.fillText(LABEL[rr], W * 0.95, cy + dpx * 0.55);
      }
    }

    if (now.getMinutes() !== lastSR) {
      lastSR = now.getMinutes();
      sr.textContent = pad2(vals[0]) + ':' + pad2(vals[1]) + ' local time, in factorial base.';
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  resize();
  start();
})();
</script>
<script>window.aboutClock = {
  title: 'Factoradic',
  board: { label: 'Ciphers', href: '/clocks/numerals/' },
  body: '<p>In the factorial number system, place values are factorials instead of powers of ten. Here the columns are 24, 6, 2, 1, and each digit is drawn as that many dots.</p>'
      + '<p>Multiply each dot-count digit by its column weight and add them up to get the hour, minute, or second. The plain value sits at the end so you can check your work without gaslighting yourself.</p>'
      + '<p>Factoradics are used to index permutations, which means this clock is technically a shuffle counter. If you’re late, just say you’re in permutation #42 and let everyone argue with the math.</p>'
      + '<p class="about-map"><a href="https://en.wikipedia.org/wiki/Factorial_number_system" target="_blank" rel="noopener">Factorial number system</a></p>'
};</script>

<script>

      fl.href = 'https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap';

    // ---- styles (injected once) ----------------------------------------

      '.about-backdrop[hidden]{display:none;}' +
      '.about-backdrop{position:fixed;inset:0;z-index:1000;display:flex;' +
      'align-items:center;justify-content:center;padding:24px;' +
      'background:rgba(2,5,11,0.40);backdrop-filter:blur(8px);' +
      'opacity:0;transition:opacity .34s ease;}' +
      '.about-backdrop[data-open]{opacity:1;}' +
      '.about-card{position:relative;max-width:30rem;width:100%;' +
      'max-height:calc(100vh - 48px);overflow:auto;' +
      'background:var(--bg2, var(--bg, #060a14));' +
      'border:1px solid rgba(150,154,168,0.18);border-radius:12px;' +
      'box-shadow:0 18px 60px rgba(0,0,0,0.5);' +
      'padding:26px 26px 20px;' +
      "font-family:'Atkinson Hyperlegible', ui-sans-serif, system-ui, -apple-system, sans-serif;" +
      'color:var(--ink, rgba(255,255,255,0.82));' +
      'transform:translateY(10px);transition:transform .34s ease;}' +
      '.about-backdrop[data-open] .about-card{transform:none;}' +

      'letter-spacing:0.34em;text-transform:uppercase;' +
      'color:var(--accent, #5cd9ff);padding-right:32px;}' +
      '.about-card p{margin:0 0 11px;font-size:13px;line-height:1.62;' +
      'letter-spacing:0.01em;color:var(--ink, rgba(255,255,255,0.82));}' +
      '.about-body a{color:var(--accent, #5cd9ff);text-decoration:underline;' +
      'text-decoration-thickness:1px;text-underline-offset:2px;font-weight:600;' +
      'border-radius:2px;transition:opacity .2s ease;}' +
      '.about-body a:hover,.about-body a:focus-visible{text-decoration-thickness:2px;opacity:0.82;}' +
      '.about-pages{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;' +

      '.about-pages::-webkit-scrollbar{display:none;}' +

      '.about-page>:first-child{margin-top:0;}' +

      '.about-card .about-map{margin:14px 0 4px;padding-top:13px;' +
      'border-top:1px solid rgba(128,128,128,0.22);font-size:12px;' +
      'line-height:1.7;color:var(--dim, rgba(255,255,255,0.52));}' +
      '.about-card .about-map b{color:var(--accent, #5cd9ff);font-weight:600;}' +
      '.about-foot{display:flex;justify-content:space-between;align-items:center;' +
      'margin-top:18px;gap:10px 16px;flex-wrap:wrap;}' +
      '.about-foot a{color:var(--accent, #5cd9ff);text-decoration:none;' +
      'font-size:11px;letter-spacing:0.12em;text-transform:uppercase;}' +
      '.about-foot a.about-board::before{content:"\\2039\\00a0";}' +
      '.about-foot a:hover,.about-foot a:focus-visible{text-decoration:underline;}' +
      '.about-close{position:absolute;top:14px;right:14px;width:32px;height:32px;' +
      'display:flex;align-items:center;justify-content:center;cursor:pointer;' +
      'background:none;border:none;color:var(--dim, rgba(255,255,255,0.55));' +
      "font:700 22px/1 'Atkinson Hyperlegible', ui-sans-serif, sans-serif;border-radius:4px;}" +
      '.about-close:hover,.about-close:focus-visible{color:var(--accent, #5cd9ff);' +

    style.textContent = css;

    // ---- dialog DOM -----------------------------------------------------

    backdrop.hidden = true;

    card.setAttribute('role', 'dialog');
    card.setAttribute('aria-modal', 'true');
    card.setAttribute('aria-labelledby', 'about-title');
    card.tabIndex = -1;

    var titleId = 'about-title';
    card.innerHTML =
      '<button class="about-close" type="button" aria-label="Close">×</button>' +
      '<h2 id="' + titleId + '"></h2>' +
      '<div class="about-body"></div>' +
      '<div class="about-foot">' +
        '<a class="about-board" href="/clocks/">all clocks</a>' +
        '<a href="https://datapoems.io">data poems</a>' +
        '<a href="https://lukesteuber.com">about me</a>' +
      '</div>';
    card.querySelector('h2').textContent = cfg.title || 'About this clock';
    var bodyEl = card.querySelector('.about-body');
    // cfg.pages (array of HTML strings) => a horizontal snap-scroll sequence with
    // dots, so a long modal becomes a few swipeable pages. cfg.body => one column.
    if (cfg.pages && cfg.pages.length) {
      var phtml = '<div class="about-pages">';
      for (var pi = 0; pi < cfg.pages.length; pi++) phtml += '<div class="about-page">' + cfg.pages[pi] + '</div>';
      bodyEl.innerHTML = phtml + '</div><div class="about-dots"></div>';
      var pagesEl = bodyEl.querySelector('.about-pages');
      var dotsEl = bodyEl.querySelector('.about-dots');
      cfg.pages.forEach(function (_, idx) {
