<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in negabinary, base minus two. Hours, minutes and seconds are shown as rows of bits whose place values alternate positive and negative: plus one, minus two, plus four, minus eight, and so on. A lit dot is a one. The exact time is shown beside each row and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);

  var ON = '#c79bff', GLOW = 'rgba(199,155,255,0.7)';
  var POS = 'rgba(150,210,255,0.5)', NEG = 'rgba(255,150,170,0.5)';
  var LABEL = ['HOURS', 'MINUTES', 'SECONDS'];
  var BITS = 7;                                   // weights 1,-2,4,-8,16,-32,64 cover 0..59
  var WEIGHTS = [64, -32, 16, -8, 4, -2, 1];      // MSB..LSB left to right

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // negabinary digits, MSB-first, fixed BITS wide
  function toNega(n) {
    var d = [];
    var v = n;
    while (v !== 0) {
      var r = v % -2; v = Math.trunc(v / -2);
      if (r < 0) { r += 2; v += 1; }
      d.push(r);                                  // LSB first
    }
    while (d.length < BITS) d.push(0);
    return d.reverse();                            // MSB first
  }

  // --------------------------------------------------------------------------
  // CANVAS SIZING (DPR-aware)
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  var lastSR = -1;

  function tick() {
    var now = new Date();
    var vals = [now.getHours(), now.getMinutes(), now.getSeconds()];

    ctx.fillStyle = '#0b0814'; ctx.fillRect(0, 0, W, H);

    var rowGap = Math.min(H * 0.26, W * 0.5);
    var cy0 = H / 2 - rowGap;
    var dotR = Math.max(5, Math.min(W / 22, rowGap * 0.2));
    var pitch = dotR * 2.5;
    var bitsW = (BITS - 1) * pitch;
    var decGap = pitch * 1.2;
    var decW = embedded ? 0 : dotR * 3.2;
    var blockW = bitsW + (embedded ? 0 : decGap + decW);
    var cx0 = W / 2 - blockW / 2;

    for (var rr = 0; rr < 3; rr++) {
      var cy = cy0 + rr * rowGap;
      var bits = toNega(vals[rr]);
      for (var i = 0; i < BITS; i++) {
        var x = cx0 + i * pitch;
        var on = bits[i] === 1;
        // a tiny tick above each dot marks whether the place is positive or negative
        ctx.fillStyle = WEIGHTS[i] > 0 ? POS : NEG;
        ctx.fillRect(x - dotR * 0.5, cy - pitch * 0.62, dotR, Math.max(2, dotR * 0.16));
        ctx.save();
        if (on) {
          ctx.fillStyle = ON; ctx.shadowColor = GLOW; ctx.shadowBlur = dotR * 1.3;
          ctx.beginPath(); ctx.arc(x, cy, dotR, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.strokeStyle = 'rgba(199,155,255,0.22)'; ctx.lineWidth = Math.max(1.4, dotR * 0.18);
          ctx.beginPath(); ctx.arc(x, cy, dotR * 0.82, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      }
      if (!embedded) {
        ctx.fillStyle = 'rgba(199,155,255,0.7)';
        var tp = Math.max(12, dotR * 1.25);
        ctx.font = '600 ' + Math.round(tp) + 'px "JetBrains Mono", monospace';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(pad2(vals[rr]), cx0 + bitsW + decGap, cy);
      }
    }

    if (now.getMinutes() !== lastSR) {
      lastSR = now.getMinutes();
      sr.textContent = pad2(vals[0]) + ':' + pad2(vals[1]) + ' local time, in negabinary.';
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  resize();
  start();
})();
</script>
<script>window.aboutClock = {
  title: 'Negabinary',
  board: { label: 'Ciphers', href: '/clocks/numerals/' },
  body: '<p>Negabinary is ordinary binary with one twist: instead of counting in powers of two, it counts in powers of minus two, so the place values alternate sign, +1, −2, +4, −8, +16, and so on. A lit dot still just means “include this place”; you add up the mix of positives and negatives to get the number.</p>'
      + '<p>It is more a mathematical curiosity than an everyday system, but it has a neat trick that drew engineers to it: because the places already carry minus signs, you can write negative numbers with no separate minus sign at all.</p>'
      + '<p>Here the hour, minute and second are each written in negabinary, a row of dots per value. The tiny markers show which columns are positive and which are negative so you can follow the pattern, and the plain number sits at the end so you can stop decoding whenever you remember you have a life.</p>'
      + '<p>The no-minus-sign trick feels like cheating in a polite way. If you’re running late, claim you’re at minus three minutes, then arrive early to prove it.</p>'
      + '<p class="about-map"><a href="https://en.wikipedia.org/wiki/Negative_base" target="_blank" rel="noopener">Negative base</a></p>'
};</script>
