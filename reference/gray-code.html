<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in Gray code, a reflected-binary numbering where moving to the next value flips exactly one bit. Three rows of bits show hours, minutes and seconds; a lit dot is a one, an empty ring is a zero, and the bit that just flipped glows. The exact time is shown beside each row and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);

  var GREEN = '#46e0a0';
  var BITS = 6;                                  // 6 bits covers 0..59 (and 0..23)

  // Gray code: g = n XOR (n>>1). Consecutive values differ by exactly one bit.
  function gray(n) { return n ^ (n >> 1); }
  function bitsOf(g) { var a = []; for (var i = BITS - 1; i >= 0; i--) a.push((g >> i) & 1); return a; }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // --------------------------------------------------------------------------
  // CANVAS SIZING (DPR-aware)
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // track the previous Gray value per row so the single flipped bit can glow
  var prev = [-1, -1, -1];
  var flashBit = [0, 0, 0];                      // bitmask of bits that flipped on the last change
  var flashAt = [0, 0, 0];                       // timestamp of that change
  var FLASH = 700;

  var lastSR = -1;

  function tick(t) {
    t = t || 0;
    var now = new Date();
    var vals = [now.getHours(), now.getMinutes(), now.getSeconds()];
    var grays = [gray(vals[0]), gray(vals[1]), gray(vals[2])];
    for (var r = 0; r < 3; r++) {
      if (grays[r] !== prev[r] && prev[r] >= 0) {
        // every bit that flipped: a normal tick flips exactly one, but the
        // wrap (59->0, 23->0) flips several at once, so flash all of them.
        flashBit[r] = grays[r] ^ prev[r];
        flashAt[r] = t;
      }
      prev[r] = grays[r];
    }

    ctx.clearRect(0, 0, W, H);

    // three rows stacked; size dots so a row of bits plus its decimal label fits
    // the width with the whole block centred. Portrait-friendly.
    var rowGap = Math.min(H * 0.26, W * 0.55);
    var dotR = Math.max(5, Math.min(W / 20, rowGap * 0.24));
    var pitch = dotR * 2.4;
    var bitsW = (BITS - 1) * pitch;
    var decGap = pitch * 1.3;
    var decW = embedded ? 0 : dotR * 3.4;
    var blockW = bitsW + (embedded ? 0 : decGap + decW);
    var cx0 = W / 2 - blockW / 2;
    var cy0 = H / 2 - rowGap;

    for (var rr = 0; rr < 3; rr++) {
      var cy = cy0 + rr * rowGap;
      var bits = bitsOf(grays[rr]);
      for (var i = 0; i < BITS; i++) {
        var x = cx0 + i * pitch;
        var on = bits[i] === 1;
        // LSB index for this column: BITS-1-i
        var bidx = BITS - 1 - i;
        var fresh = ((flashBit[rr] >> bidx) & 1) === 1 && (t - flashAt[rr] < FLASH);
        var fa = fresh ? (1 - (t - flashAt[rr]) / FLASH) : 0;
        ctx.save();
        if (on) {
          ctx.fillStyle = GREEN;
          ctx.shadowColor = 'rgba(70,224,160,0.7)';
          ctx.shadowBlur = Math.max(6, dotR * (0.8 + fa * 1.4));
          ctx.beginPath(); ctx.arc(x, cy, dotR * (1 + fa * 0.18), 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.strokeStyle = 'rgba(70,224,160,' + (0.22 + fa * 0.5) + ')';
          ctx.lineWidth = Math.max(1.4, dotR * 0.18);
          ctx.beginPath(); ctx.arc(x, cy, dotR * 0.82, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      }
      // decoded decimal at the right (standalone only)
      if (!embedded) {
        ctx.save();
        ctx.fillStyle = 'rgba(245,180,65,0.62)';
        var tp = Math.max(12, dotR * 1.3);
        ctx.font = '600 ' + Math.round(tp) + 'px "JetBrains Mono", monospace';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(pad2(vals[rr]), cx0 + bitsW + decGap, cy);
        ctx.restore();
      }
    }

    if (now.getMinutes() !== lastSR) {
      lastSR = now.getMinutes();
      sr.textContent = pad2(vals[0]) + ':' + pad2(vals[1]) + ' local time, in Gray code.';
    }
  }

  var rafId = null;
  function loop(t) { tick(t); rafId = requestAnimationFrame(loop); }
  function start() { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  resize();
  start();
})();
</script>
<script>window.aboutClock = {
  title: 'Gray Code',
  board: { label: 'Ciphers', href: '/clocks/numerals/' },
  body: '<p>Gray code is a reordering of binary where counting up flips exactly one bit each step. So instead of a whole row changing at once, you get one clean little blink per tick.</p>'
      + '<p>Each row is hours, minutes, seconds. Filled dots are 1, empty rings are 0, and the bit that just changed gets a brief glow so you can spot the motion.</p>'
      + '<p>Ordinary binary going from 7 to 8 is a dramatic costume change. Gray code flips one bit, like it just changed its mind about one sock. Minimal effort, maximum vibe.</p>'
      + '<p class="about-map"><a href="https://en.wikipedia.org/wiki/Gray_code" target="_blank" rel="noopener">Gray code</a></p>'
};</script>
