  // `bits` lists the place-values that column can actually take (impossible

    { label: 'H', bits: [8, 4, 2, 1] },
    { label: 'M', bits: [4, 2, 1] },
    { label: 'M', bits: [8, 4, 2, 1] },
    { label: 'S', bits: [4, 2, 1] },

    var x = x0;
    for (var c = 0; c < 6; c++) {

      xs.push(x); x += colGap;

      // full-page view — it would be dead weight inside a gallery preview iframe.
      if (window.self !== window.top) return;
      var hs = document.createElement('style');
      hs.textContent =
        ".about-help-auto{position:fixed;top:max(.6rem,env(safe-area-inset-top));" +
        "right:max(.6rem,env(safe-area-inset-right));z-index:30;display:flex;" +
        "align-items:center;justify-content:center;min-width:44px;min-height:44px;" +
        "background:none;border:none;cursor:pointer;color:var(--accent,#5cd9ff);" +
        "opacity:.55;font:700 19px/1 'Atkinson Hyperlegible',ui-sans-serif,sans-serif;" +
        "border-radius:6px;transition:opacity .25s ease;}" +
        ".about-help-auto:hover,.about-help-auto:focus-visible{opacity:1;}" +
        ".about-help-auto:focus-visible{outline:2px solid currentColor;outline-offset:3px;}";
      document.head.appendChild(hs);
      trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = 'about-help-auto';
      trigger.setAttribute('aria-label', 'About this clock');
      trigger.textContent = '?';
      document.body.appendChild(trigger);
    }

    // load the reading font (Atkinson Hyperlegible, as used across the other
    // projects) so explanatory prose never falls back to the console mono.
    if (!document.querySelector('link[data-about-font]')) {
      var fl = document.createElement('link');
      fl.rel = 'stylesheet';
      fl.setAttribute('data-about-font', '');
      fl.href = 'https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap';
      document.head.appendChild(fl);
    }

    // ---- styles (injected once) ----------------------------------------
    var css =
      '.about-backdrop[hidden]{display:none;}' +
      '.about-backdrop{position:fixed;inset:0;z-index:1000;display:flex;' +
      'align-items:center;justify-content:center;padding:24px;' +
      'background:rgba(2,5,11,0.40);backdrop-filter:blur(8px);' +
      'opacity:0;transition:opacity .34s ease;}' +
      '.about-backdrop[data-open]{opacity:1;}' +
      '.about-card{position:relative;max-width:30rem;width:100%;' +
      'max-height:calc(100vh - 48px);overflow:auto;' +
      'background:var(--bg2, var(--bg, #060a14));' +
      'border:1px solid rgba(150,154,168,0.18);border-radius:12px;' +
      'box-shadow:0 18px 60px rgba(0,0,0,0.5);' +
      'padding:26px 26px 20px;' +
      "font-family:'Atkinson Hyperlegible', ui-sans-serif, system-ui, -apple-system, sans-serif;" +
      'color:var(--ink, rgba(255,255,255,0.82));' +
      'transform:translateY(10px);transition:transform .34s ease;}' +
      '.about-backdrop[data-open] .about-card{transform:none;}' +
      '.about-card h2{margin:0 0 12px;font-size:13px;font-weight:700;' +
      'letter-spacing:0.34em;text-transform:uppercase;' +
      'color:var(--accent, #5cd9ff);padding-right:32px;}' +
      '.about-card p{margin:0 0 11px;font-size:13px;line-height:1.62;' +
      'letter-spacing:0.01em;color:var(--ink, rgba(255,255,255,0.82));}' +
      '.about-body a{color:var(--accent, #5cd9ff);text-decoration:underline;' +
      'text-decoration-thickness:1px;text-underline-offset:2px;font-weight:600;' +
      'border-radius:2px;transition:opacity .2s ease;}' +
      '.about-body a:hover,.about-body a:focus-visible{text-decoration-thickness:2px;opacity:0.82;}' +
      '.about-pages{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;' +
      '-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -26px;}' +
      '.about-pages::-webkit-scrollbar{display:none;}' +
      '.about-page{flex:0 0 100%;scroll-snap-align:center;padding:0 26px;box-sizing:border-box;}' +
      '.about-page>:first-child{margin-top:0;}' +
      '.about-dots{display:flex;justify-content:center;gap:9px;margin-top:18px;}' +
      '.about-dot{width:7px;height:7px;border-radius:50%;border:none;padding:0;cursor:pointer;' +
      'background:rgba(150,154,168,0.3);transition:background .2s, transform .2s;}' +
      '.about-dot.on{background:var(--accent, #5cd9ff);transform:scale(1.25);}' +
      '.about-card .about-map{margin:14px 0 4px;padding-top:13px;' +
      'border-top:1px solid rgba(128,128,128,0.22);font-size:12px;' +
      'line-height:1.7;color:var(--dim, rgba(255,255,255,0.52));}' +
      '.about-card .about-map b{color:var(--accent, #5cd9ff);font-weight:600;}' +
      '.about-foot{display:flex;justify-content:space-between;align-items:center;' +
      'margin-top:18px;gap:10px 16px;flex-wrap:wrap;}' +
      '.about-foot a{color:var(--accent, #5cd9ff);text-decoration:none;' +
      'font-size:11px;letter-spacing:0.12em;text-transform:uppercase;}' +
      '.about-foot a.about-board::before{content:"\\2039\\00a0";}' +
      '.about-foot a:hover,.about-foot a:focus-visible{text-decoration:underline;}' +
      '.about-close{position:absolute;top:14px;right:14px;width:32px;height:32px;' +
      'display:flex;align-items:center;justify-content:center;cursor:pointer;' +
      'background:none;border:none;color:var(--dim, rgba(255,255,255,0.55));' +
      "font:700 22px/1 'Atkinson Hyperlegible', ui-sans-serif, sans-serif;border-radius:4px;}" +
      '.about-close:hover,.about-close:focus-visible{color:var(--accent, #5cd9ff);' +
      'outline:2px solid var(--accent, #5cd9ff);outline-offset:1px;}';
    var style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    // ---- dialog DOM -----------------------------------------------------
    var backdrop = document.createElement('div');
    backdrop.className = 'about-backdrop';
    backdrop.hidden = true;

    var card = document.createElement('div');
    card.className = 'about-card';
    card.setAttribute('role', 'dialog');
    card.setAttribute('aria-modal', 'true');
    card.setAttribute('aria-labelledby', 'about-title');
    card.tabIndex = -1;

    var titleId = 'about-title';
    card.innerHTML =
      '<button class="about-close" type="button" aria-label="Close">×</button>' +
      '<h2 id="' + titleId + '"></h2>' +
      '<div class="about-body"></div>' +
      '<div class="about-foot">' +
        '<a class="about-board" href="/clocks/">all clocks</a>' +
        '<a href="https://datapoems.io">data poems</a>' +
        '<a href="https://lukesteuber.com">about me</a>' +
      '</div>';
    card.querySelector('h2').textContent = cfg.title || 'About this clock';
    var bodyEl = card.querySelector('.about-body');
    // cfg.pages (array of HTML strings) => a horizontal snap-scroll sequence with
    // dots, so a long modal becomes a few swipeable pages. cfg.body => one column.
    if (cfg.pages && cfg.pages.length) {
      var phtml = '<div class="about-pages">';
      for (var pi = 0; pi < cfg.pages.length; pi++) phtml += '<div class="about-page">' + cfg.pages[pi] + '</div>';
      bodyEl.innerHTML = phtml + '</div><div class="about-dots"></div>';
      var pagesEl = bodyEl.querySelector('.about-pages');
      var dotsEl = bodyEl.querySelector('.about-dots');
      cfg.pages.forEach(function (_, idx) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'about-dot' + (idx === 0 ? ' on' : '');
        dot.setAttribute('aria-label', 'Page ' + (idx + 1));
        dot.addEventListener('click', function () {
          pagesEl.scrollTo({ left: idx * pagesEl.clientWidth, behavior: 'smooth' });
        });
        dotsEl.appendChild(dot);
      });
      pagesEl.addEventListener('scroll', function () {
        var idx = Math.round(pagesEl.scrollLeft / Math.max(1, pagesEl.clientWidth));
        for (var k = 0; k < dotsEl.children.length; k++) {
          dotsEl.children[k].className = 'about-dot' + (k === idx ? ' on' : '');
        }
      }, { passive: true });
    } else {
      bodyEl.innerHTML = cfg.body;
    }
    // Optional per-clock board link, e.g. { label: 'Ciphers', href: '/clocks/numerals/' }.
    var boardLink = card.querySelector('.about-board');
    if (cfg.board && cfg.board.href) {
      boardLink.setAttribute('href', cfg.board.href);
      boardLink.textContent = cfg.board.label || 'back';
    }

    backdrop.appendChild(card);
    document.body.appendChild(backdrop);

    var closeBtn = card.querySelector('.about-close');
    var lastFocus = null;

    function focusables() {
      return Array.prototype.slice.call(
        card.querySelectorAll('a[href], button:not([disabled])')
      );
    }

    function open() {
      lastFocus = document.activeElement;
      backdrop.hidden = false;
      // force reflow so the opacity transition runs
      void backdrop.offsetWidth;
      backdrop.setAttribute('data-open', '');
      card.focus();
      document.addEventListener('keydown', onKey, true);
    }

    function close() {
      backdrop.removeAttribute('data-open');
      document.removeEventListener('keydown', onKey, true);
      setTimeout(function () { backdrop.hidden = true; }, 200);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key === 'Tab') {
        var f = focusables();
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault(); first.focus();
        }
      }
    }

    backdrop.addEventListener('click', function (e) {
      if (e.target === backdrop) close();
    });
    closeBtn.addEventListener('click', close);

    // upgrade the "?" trigger to open the dialog (keep href as fallback).
    // Relabel it: the original markup often labelled this control for its old
    // job (a link to the gallery or my site), which is now misleading once it
    // opens the explainer dialog. Name it for what it actually does.
    trigger.setAttribute('role', 'button');
    trigger.setAttribute('aria-haspopup', 'dialog');
    trigger.setAttribute('aria-label', cfg.title ? 'About the ' + cfg.title + ' clock' : 'About this clock');
    trigger.addEventListener('click', function (e) {
      e.preventDefault();
      open();
    });
  });
})();
</script>
