<body>
  <canvas id="scene" role="img"
    aria-label="The current local 24-hour time written as three I Ching hexagrams. Each number, the hour, the minute and the second, is a stack of six yin or yang lines that spell its value in binary, built from the bottom line upward. A broken line is a zero, a solid line is a one. The two-digit value is shown under each hexagram and the time is announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');

  var CYAN = '#c084fc';
  var AMBER = '#f5b441';
  var LABEL = ['HOUR', 'MINUTE', 'SECOND'];

  // --------------------------------------------------------------------------
  // ENCODING
  // A hexagram is six horizontal lines stacked vertically. Each line is one
  // bit of the value's 6-bit binary (0..63 covers 0..59):
  //   solid line  (yang) = bit 1  -> one unbroken horizontal bar
  //   broken line (yin)  = bit 0  -> a bar with a gap in the middle
  // Convention: BOTTOM-UP. bit 0 (least significant) is the BOTTOM line and
  // bit 5 (most significant) is the TOP line. So line index i from the top is
  // bit (5 - i). We store a per-line animation phase so a flip between broken
  // and solid morphs over ~250ms rather than snapping.
  // --------------------------------------------------------------------------

  // animation state: three columns (H, M, S), six lines each. `phase` runs
  // 0..1 toward the line's current target bit; `from`/`to` are the bit values
  // it is interpolating between.
  var FLIP_MS = 250;
  var cols = [];
  for (var c = 0; c < 3; c++) {
    var lines = [];
    for (var l = 0; l < 6; l++) lines.push({ from: 0, to: 0, t: 0, start: 0 });
    cols.push(lines);
  }
  var initialised = false;

  function bitsOf(value) {
    // index 0 = top line (bit 5) ... index 5 = bottom line (bit 0)
    var out = [];
    for (var i = 0; i < 6; i++) {
      var bit = 5 - i;            // top line is the most significant bit
      out.push((value >> bit) & 1);
    }
    return out;
  }

  // set targets for one column; kick off a flip animation when a bit changes
  function setColumn(c, value, nowMs) {
    var bits = bitsOf(value);
    var lines = cols[c];
    for (var i = 0; i < 6; i++) {
      var ln = lines[i];
      var target = bits[i];
      if (!initialised) {
        ln.from = ln.to = target; ln.t = 1;
      } else if (target !== ln.to) {
        ln.from = ln.to;          // current resting bit
        ln.to = target;
        ln.t = 0;
        ln.start = nowMs;
      }
    }
  }

  function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

  // --------------------------------------------------------------------------
  // DRAW ONE LINE
  // A line is drawn as a horizontal bar of total width `w`, centred at (cx,cy).
  // `solidness` in [0,1] morphs between a broken line (0) and a solid one (1)
  // by closing the central gap: the two halves slide inward and a bridging
  // segment fades in across the middle.
  // --------------------------------------------------------------------------
  function drawLine(cx, cy, w, thickness, solidness) {
    var half = w / 2;
    var gap = w * 0.20;                       // gap half-width at full yin
    var g = gap * (1 - solidness);            // shrinking gap as we approach yang

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = thickness;
    ctx.strokeStyle = CYAN;
    ctx.shadowColor = 'rgba(192,132,252,0.55)';
    ctx.shadowBlur = Math.max(6, thickness * 0.9);

    if (g > thickness * 0.25) {
      // broken: two arms with a gap
      ctx.beginPath();
      ctx.moveTo(cx - half, cy);
      ctx.lineTo(cx - g, cy);
      ctx.moveTo(cx + g, cy);
      ctx.lineTo(cx + half, cy);
      ctx.stroke();
      // a faint bridge fading in as the gap closes
      if (solidness > 0.5) {
        ctx.globalAlpha = (solidness - 0.5) * 2;
        ctx.beginPath();
        ctx.moveTo(cx - g, cy);
        ctx.lineTo(cx + g, cy);
        ctx.stroke();
      }
    } else {
      // solid: one continuous bar
      ctx.beginPath();
      ctx.moveTo(cx - half, cy);
      ctx.lineTo(cx + half, cy);
      ctx.stroke();
    }
    ctx.restore();
  }

  // --------------------------------------------------------------------------
  // CANVAS SIZING
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // --------------------------------------------------------------------------
  // RENDER
  // --------------------------------------------------------------------------
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  var lastSR = -1;

  function tick() {
    var now = new Date();
    var nowMs = now.getTime();
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();

    setColumn(0, h, nowMs);
    setColumn(1, m, nowMs);
    setColumn(2, s, nowMs);
    initialised = true;

    ctx.clearRect(0, 0, W, H);

    var base = Math.min(W, H);
    // vertical portrait layout: three hexagrams stacked
    var rowGap = Math.min(H * 0.29, 155);
    var cy0 = H / 2 - rowGap;
    var hexHeight = Math.min(rowGap * 0.82, H * 0.26);
    var lineGap = hexHeight / 5.5;                       // 6 lines, 5 gaps
    var lineW = Math.min(W * 0.58, hexHeight * 0.72);    // width of one bar
    var thickness = Math.max(4.5, lineW * 0.095);
    var tagPx = Math.max(13, Math.round(lineW * 0.24));

    for (var c = 0; c < 3; c++) {
      var cy = cy0 + c * rowGap;
      var cx = W / 2;
      var topY = cy - hexHeight / 2;
      var lines = cols[c];
      for (var i = 0; i < 6; i++) {
        var ln = lines[i];
        if (ln.t < 1) {
          ln.t = Math.min(1, (nowMs - ln.start) / FLIP_MS);
        }
        var e = easeInOut(ln.t);
        var solidness = ln.from + (ln.to - ln.from) * e;
        var ly = topY + i * lineGap;
        drawLine(cx, ly, lineW, thickness, solidness);
      }
      if (window.self === window.top) {
        ctx.save();
        ctx.fillStyle = 'rgba(245,180,65,0.72)';
        ctx.font = '600 ' + tagPx + 'px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pad2([h, m, s][c]), cx, topY + hexHeight + lineGap * 1.85);
        ctx.fillStyle = 'rgba(243,230,255,0.42)';
        ctx.font = '600 ' + Math.round(tagPx * 0.55) + 'px "JetBrains Mono", monospace';
        ctx.fillText(LABEL[c], cx, topY + hexHeight + lineGap * 2.85);
        ctx.restore();
      }
    }

    if (m !== lastSR) {
      lastSR = m;
      sr.textContent = pad2(h) + ':' + pad2(m) + ' local time, as I Ching hexagrams.';
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  // brief read-it caption: shown on load, again on tap or key, fading after a pause
  var legend = document.getElementById('legend');
  var legendTimer = null;
  function flashLegend() {
    if (!legend) return;
    legend.classList.add('show');
    if (legendTimer) clearTimeout(legendTimer);
    legendTimer = setTimeout(function () { legend.classList.remove('show'); }, 5000);
  }
  document.addEventListener('pointerup', function (e) {
    if (e.target.closest && e.target.closest('a')) return;
    flashLegend();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flashLegend(); }
  });
  if (window.self === window.top) flashLegend();  // standalone only, not in gallery embeds

  resize();
  start();
})();
</script>
<script>window.aboutClock = {
  title: 'I Ching',
  board: { label: 'Ciphers', href: '/clocks/numerals/' },
  body: '<p>The I Ching, or Book of Changes, is one of the oldest Chinese classics, a divination manual more than three thousand years old. Its heart is sixty-four hexagrams, each a stack of six lines that is either solid (yang) or broken (yin). People consulted them by casting yarrow stalks or coins to read a pattern for the moment.</p>'
      + '<p>Because each line is one of two states, a hexagram doubles neatly as a six-bit binary number: solid is 1, broken is 0, read from the bottom up as 1, 2, 4, 8, 16, 32. This clock shows three hexagrams, for hours, minutes, and seconds, with the plain value underneath. Six lines give 64 patterns, plenty for anything up to 59.</p>'
      + '<p>If you’ve ever wanted a fortune cookie that also does base-2, you’re in luck. I consulted the hexagrams about my day and they said “solid line”, which is unhelpful but extremely confident.</p>'
      + '<p class="about-map"><a href="https://en.wikipedia.org/wiki/I_Ching" target="_blank" rel="noopener">I Ching</a></p>'
};</script>

    // Relabel it: the original markup often labelled this control for its old
    // job (a link to the gallery or my site), which is now misleading once it
    // opens the explainer dialog. Name it for what it actually does.
    trigger.setAttribute('role', 'button');
    trigger.setAttribute('aria-haspopup', 'dialog');
    trigger.setAttribute('aria-label', cfg.title ? 'About the ' + cfg.title + ' clock' : 'About this clock');
    trigger.addEventListener('click', function (e) {
      e.preventDefault();
      open();
    });
  });
})();
</script>
