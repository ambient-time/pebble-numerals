<body>
  <canvas id="scene" role="img"
    aria-label="The current local time written in Babylonian base-60 cuneiform: three sexagesimal digits for hours, minutes and seconds. Tens are corner wedges, units are vertical wedges. Each column's decoded two-digit value is shown beneath it, and the time is announced."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');

  var CYAN = '#4a3320';
  var AMBER = '#2f5488';

  // --------------------------------------------------------------------------
  // CANVAS SIZING
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // --------------------------------------------------------------------------
  // WEDGES
  // Every mark is a real cuneiform impression: a filled triangle/teardrop with a
  // soft inner highlight so it reads as pressed into clay. Phosphor cyan, glow.
  //
  //   drawNail   — a vertical wedge "|"  (value 1, the unit). Apex up, the wide
  //                triangular head, tapering to a thin tail beneath: a nail driven
  //                point-first into the tablet.
  //   drawCorner — a "Winkelhaken" / corner wedge (value 10, the ten). A hooked
  //                chevron impression opening to the upper-right.
  // --------------------------------------------------------------------------

  function glow(blur) {
    ctx.shadowColor = 'rgba(74,51,32,0.55)';
    ctx.shadowBlur = blur;
  }

  // A vertical unit wedge centred horizontally at x, head at top y, height h.
  function drawNail(x, y, h, dim) {
    var hw = h * 0.20;          // half-width of the head
    var headLen = h * 0.42;     // triangular head length before it tapers
    ctx.save();
    glow(dim ? 3 : Math.max(5, h * 0.10));
    // body: a tapered nail — wide flat head at top, point at the bottom
    ctx.beginPath();
    ctx.moveTo(x - hw, y);              // top-left of head
    ctx.lineTo(x + hw, y);             // top-right of head
    ctx.lineTo(x + hw * 0.30, y + headLen);
    ctx.lineTo(x, y + h);              // the driven point
    ctx.lineTo(x - hw * 0.30, y + headLen);
    ctx.closePath();
    ctx.fillStyle = dim ? 'rgba(74,51,32,0.20)' : CYAN;
    ctx.fill();
    ctx.restore();
  }

  // A corner/Winkelhaken ten wedge. `s` is the nominal size. Anchored so its
  // hook-corner sits at (x,y); the hook opens up and to the right.
  function drawCorner(x, y, s, dim) {
    var w = s * 0.92, ht = s * 0.78;
    ctx.save();
    glow(dim ? 3 : Math.max(5, s * 0.10));
    // the wedge body — a chevron/hook impression: corner at lower-left,
    // two limbs sweeping to a triangular pressed head.
    ctx.beginPath();
    ctx.moveTo(x, y);                          // hook corner
    ctx.lineTo(x + w, y - ht * 0.42);          // upper limb tip
    ctx.lineTo(x + w * 0.62, y - ht * 0.20);   // inner notch
    ctx.lineTo(x + w * 0.30, y - ht);          // upper limb back / the head
    ctx.lineTo(x + w * 0.10, y - ht * 0.50);   // inner notch
    ctx.closePath();
    ctx.fillStyle = dim ? 'rgba(74,51,32,0.20)' : CYAN;
    ctx.fill();
    ctx.restore();
  }

  // The "zero" placeholder: a faint pair of slanted wedges marking an empty
  // sexagesimal place — the later Babylonian gap-filler glyph.
  function drawZero(cx, cy, s) {
    ctx.save();
    ctx.strokeStyle = 'rgba(74,51,32,0.22)';
    ctx.lineWidth = Math.max(1.5, s * 0.06);
    ctx.lineCap = 'round';
    var off = s * 0.42;
    for (var i = -1; i <= 1; i += 2) {
      ctx.beginPath();
      ctx.moveTo(cx + i * off - s * 0.18, cy + s * 0.34);
      ctx.lineTo(cx + i * off + s * 0.18, cy - s * 0.34);
      ctx.stroke();
    }
    ctx.restore();
  }

  // --------------------------------------------------------------------------
  // RENDER
  // --------------------------------------------------------------------------
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  var lastSR = -1;

  function tick() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();

    ctx.clearRect(0, 0, W, H);

    var base = Math.min(W, H);
    // unit = the size scale for a single wedge mark
    var unit = Math.max(10, base * 0.052);
    var vals = [h, m, s];
    var standalone = (window.self === window.top);

    if (H > W * 1.05) {
      // portrait: the three sexagesimal places stacked, hours over minutes over
      // seconds (each digit still balances tens-wedges left, unit-nails right).
      unit = Math.max(8, Math.min(W * 0.18, H * 0.072));
      var rowGap = unit * 3.9;
      var cyMid = H / 2 - (standalone ? unit * 0.6 : 0);
      for (var i = 0; i < 3; i++) {
        // centre each stacked digit on its own bounding box (the tens/units split
        // is biased right, so nudge by the glyph's measured midpoint)
        drawDigitClean(W / 2 + digitNudge(vals[i], unit), cyMid + (i - 1) * rowGap, vals[i], unit);
      }
      if (standalone) {
        ctx.save();
        ctx.fillStyle = 'rgba(74,51,32,0.66)';
        ctx.font = '600 ' + Math.max(11, Math.round(unit * 0.7)) + 'px "JetBrains Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowBlur = 0;
        ctx.fillText(pad2(h) + ' : ' + pad2(m) + ' : ' + pad2(s), W / 2, cyMid + rowGap + unit * 2.0);
        ctx.restore();
      }
    } else {
      // landscape: three digit columns across the width, set apart by spacing
      // alone (as the sexagesimal places were).
      var colW = unit * 4.6;
      var sep = unit * 1.9;
      var groupW = colW * 3 + sep * 2;
      if (groupW > W * 0.92) {
        var k = (W * 0.92) / groupW;
        unit *= k; colW *= k; sep *= k; groupW *= k;
      }
      var cy = H / 2 - unit * 0.15;
      var startX = W / 2 - groupW / 2;
      var centres = [];
      for (var i = 0; i < 3; i++) {
        var cx = startX + colW / 2 + i * (colW + sep);
        centres.push(cx);
        drawDigitClean(cx, cy, vals[i], unit);
      }
      if (standalone) {
        ctx.save();
        ctx.fillStyle = 'rgba(74,51,32,0.66)';
        ctx.font = '600 ' + Math.max(10, Math.round(unit * 0.55)) + 'px "JetBrains Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.shadowBlur = 0;
        for (var t = 0; t < 3; t++) ctx.fillText(pad2(vals[t]), centres[t], cy + unit * 2.15);
        ctx.restore();
      }
    }

    if (m !== lastSR) {
      lastSR = m;
      sr.textContent = pad2(h) + ':' + pad2(m) +
        ' local time, in Babylonian base-sixty cuneiform.';
    }
  }

  // Clean digit renderer. A sexagesimal digit splits into tens (corner wedges,
  // left half of the column) and units (nails, right half). Both groups lay out
  // in tidy rows of up to 3 and share the SAME vertical centreline (cy), so the
  // two halves read as one balanced glyph rather than two floating clusters.
  // horizontal shift that centres a digit's bounding box on cx (the tens cluster
  // sits left of cx, the units cluster right, so most digits need a small nudge)
  function digitNudge(value, unit) {
    if (value === 0) return 0;
    var tens = Math.floor(value / 10), units = value % 10;
    var tGap = unit * 1.12 * 1.05, tHalf = unit * 0.56;
    var uGap = unit * 0.62, uHalf = unit * 0.2;
    var lEdge = (tens > 0) ? (-unit * 0.55 - (Math.min(3, tens) - 1) * tGap - tHalf)
                           : (unit * 0.65 - uHalf);
    var rEdge = (units > 0) ? (unit * 0.65 + (Math.min(3, units) - 1) * uGap + uHalf)
                            : (-unit * 0.55 + tHalf);
    return -(lEdge + rEdge) / 2;
  }
  function drawDigitClean(cx, cy, value, unit) {
    var tens = Math.floor(value / 10);   // 0..5
    var units = value % 10;              // 0..9

    if (value === 0) { drawZero(cx, cy, unit * 1.4); return; }

    // Shared row grid. Both halves use the same row pitch so their rows line up
    // across the centreline; the whole glyph is vertically centred on cy.
    var rowGap = unit * 1.20;            // vertical pitch between rows
    var nTensRows = Math.ceil(tens / 3) || 0;
    var nUnitRows = Math.ceil(units / 3) || 0;
    var maxRows = Math.max(nTensRows, nUnitRows, 1);

    // y of the top row's anchor, so the block of rows is centred on cy
    function rowY(ri) { return cy - (maxRows - 1) * rowGap * 0.5 + ri * rowGap; }

    // ---- TENS: corner wedges, right-aligned against the column's centre gap.
    // Anchored on the right edge of the left half; rows fill from that edge
    // leftward so 1/2/3 per row stay visually grouped.
    if (tens > 0) {
      var tSize = unit * 1.12;
      var tGap = tSize * 1.05;           // horizontal pitch between corner wedges
      var tAnchorX = cx - unit * 0.55;   // right edge of the tens cluster (its hook corners)
      var tTopRi = Math.floor((maxRows - nTensRows) / 2);  // centre tens rows within the block
      var placedT = 0;
      for (var tr = 0; tr < nTensRows; tr++) {
        var inT = Math.min(3, tens - placedT);
        // right-align this row against tAnchorX
        var rightStart = tAnchorX - (inT - 1) * tGap;
        var ty = rowY(tTopRi + tr);
        for (var tc = 0; tc < inT; tc++) {
          // drawCorner anchors at the hook corner; nudge so the cluster centres on the row
          drawCorner(rightStart + tc * tGap, ty + tSize * 0.36, tSize, false);
        }
        placedT += inT;
      }
    }

    // ---- UNITS: vertical nails, left-aligned from the column's centre gap.
    if (units > 0) {
      var uH = unit * 1.12;
      var uGap = unit * 0.62;            // horizontal pitch between nails
      var uAnchorX = cx + unit * 0.65;   // left edge of the units cluster
      var uTopRi = Math.floor((maxRows - nUnitRows) / 2);  // centre unit rows within the block
      var placedU = 0;
      for (var ur = 0; ur < nUnitRows; ur++) {
        var inU = Math.min(3, units - placedU);
        var uy = rowY(uTopRi + ur) - uH * 0.5;   // nail head above the row line, point below
        for (var uc = 0; uc < inU; uc++) {
          drawNail(uAnchorX + uc * uGap, uy, uH, false);
        }
        placedU += inU;
      }
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  // brief read-it caption: shown on load, again on tap or key, fading after a pause
  var legend = document.getElementById('legend');
  var legendTimer = null;
  function flashLegend() {
    if (!legend) return;
    legend.classList.add('show');
    if (legendTimer) clearTimeout(legendTimer);
    legendTimer = setTimeout(function () { legend.classList.remove('show'); }, 5000);
  }
  document.addEventListener('pointerup', function (e) {
    if (e.target.closest && e.target.closest('a')) return;
    flashLegend();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flashLegend(); }
  });
  if (window.self === window.top) flashLegend();  // standalone only, not in gallery embeds

  resize();
  start();
})();
</script>
<script>window.aboutClock = {
  title: 'Babylonian',

  body: '<p>Babylonian numbers are base 60, built from two wedge marks pressed into clay. '
      + 'A vertical wedge is one, a corner wedge is ten, and you add them up to make any value from 0 to 59. Each column is one sexagesimal digit for hours, minutes, and seconds, which is why we still have sixty minutes in an hour.</p>'
      + '<p>Base sixty is the reason an hour has sixty minutes, so every time you are late you can technically blame Mesopotamia.</p>'
      + '<p class="about-map">Source: <a href="https://en.wikipedia.org/wiki/Babylonian_cuneiform_numerals" target="_blank" rel="noopener">Wikipedia</a>.</p>'
};</script>
