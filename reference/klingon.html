<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in real Klingon pIqaD numerals. The hour, minute and second are each two digits, drawn in the angular pIqaD script; pIqaD counts in tens with ten distinct digit signs for nought through nine. The exact time is shown beneath and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);
  var ACCENT = '#ff4a34';      // hot blood
  var STEEL = 'rgba(198,170,120,0.62)';
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // load the real pIqaD font; until it resolves (or if it fails) we fall back to
  // plain decimal digits so the clock is never unreadable.
  var fontReady = false;
  if (document.fonts && document.fonts.load) {
    document.fonts.load('48px "pIqaD"').then(function () { fontReady = document.fonts.check('48px "pIqaD"'); }).catch(function () {});
  }

  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // one pIqaD digit rendered as a lit neon tube: the glyph is drawn several times
  // with additive blending, building a wide red air-glow, a tighter red bloom, and a
  // hot near-white core (the glowing gas). `lvl` is the flicker brightness 0..1, so
  // the whole tube (core and halo together) dims and gutters as the sign flickers.
  function digit(cx, cy, d, size, lvl) {
    lvl = (lvl == null) ? 1 : lvl;
    var ch, font;
    if (fontReady) { ch = String.fromCharCode(0xF8F0 + d); font = Math.round(size) + 'px "pIqaD", monospace'; }
    else { ch = String(d); font = '600 ' + Math.round(size * 0.78) + 'px "JetBrains Mono", monospace'; }
    ctx.save();
    ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalCompositeOperation = 'lighter';
    // 1) wide air-glow
    ctx.shadowColor = 'rgba(255,40,24,' + (0.9 * lvl).toFixed(3) + ')';
    ctx.shadowBlur = size * 0.9;  ctx.fillStyle = 'rgba(150,16,10,' + (0.5 * lvl).toFixed(3) + ')';  ctx.fillText(ch, cx, cy);
    // 2) tube bloom
    ctx.shadowBlur = size * 0.36; ctx.fillStyle = 'rgba(232,46,28,' + (0.72 * lvl).toFixed(3) + ')'; ctx.fillText(ch, cx, cy);
    // 3) hot near-white core (the lit gas in the glass)
    ctx.shadowColor = 'rgba(255,130,98,' + (0.95 * lvl).toFixed(3) + ')';
    ctx.shadowBlur = size * 0.13; ctx.fillStyle = 'rgba(255,206,192,' + (0.96 * lvl).toFixed(3) + ')'; ctx.fillText(ch, cx, cy);
    ctx.restore();
  }

  // ---- Klingon dressing: a blood-and-steel war-console ---------------------
  function paintBg() {
    var g = ctx.createRadialGradient(W / 2, H * 0.46, 0, W / 2, H * 0.5, Math.max(W, H) * 0.72);
    g.addColorStop(0, '#1d0709'); g.addColorStop(0.55, '#0c0405'); g.addColorStop(1, '#030202');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // brushed-metal diagonal scoring
    ctx.strokeStyle = 'rgba(190,70,46,0.035)'; ctx.lineWidth = 1;
    for (var i = -H; i < W; i += 20) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + H, H); ctx.stroke(); }
    // vignette
    var v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.18, W / 2, H / 2, Math.max(W, H) * 0.62);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  // one pointed blade-lobe of the trefoil, drawn from the centre outward along +x
  function blade(R) {
    ctx.beginPath();
    ctx.moveTo(0, -R * 0.17);
    ctx.quadraticCurveTo(R * 0.52, -R * 0.40, R, 0);
    ctx.quadraticCurveTo(R * 0.52, R * 0.40, 0, R * 0.17);
    ctx.closePath();
  }
  // faint three-bladed Klingon-style emblem, behind the glyphs
  function emblem(cx, cy, R, t) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(t / 5000) * 0.02);
    ctx.fillStyle = 'rgba(150,28,22,0.11)'; ctx.strokeStyle = 'rgba(214,120,84,0.10)';
    ctx.lineWidth = Math.max(1, R * 0.02);
    for (var k = 0; k < 3; k++) { ctx.save(); ctx.rotate(k * Math.PI * 2 / 3 - Math.PI / 2); blade(R); ctx.fill(); ctx.stroke(); ctx.restore(); }
    ctx.beginPath(); ctx.arc(0, 0, R * 0.19, 0, Math.PI * 2); ctx.fillStyle = 'rgba(150,28,22,0.13)'; ctx.fill();
    ctx.restore();
  }
