<style>
  /* Five distinct papers, cycled by tap / Space. Each sets the paper colour,
     the embossed-dot dome shading (highlight top-left, shadow bottom-right),
     the faint recessed dimple for OFF slots (so the 2x3 cell still reads), and
     the ink for labels + controls. Tuned so raised dots are unmistakable. */

  :root {
    /* cultural palette accent (brass): UI chrome + about-modal theming only.
       The paper/dot material colours below are intentionally left untouched. */
    --accent: #d4a96a;
    --bg: #0e0900;
    --bg2: #180f00;
    --ink: rgba(250,238,214,0.86);
  }
  :root,
  :root[data-theme="cream"] {
    /* 1. Cream Perkins paper: warm stock, soft emboss shadow */
    --paper-1: #f6efdd;
    --paper-2: #f1e8d2;
    --paper-3: #ebe0c5;
    --paper-glow: rgba(255,250,238,.6);
    --grain-a: rgba(120,100,60,.022);
    --grain-b: rgba(120,100,60,.018);
    --dot-hi: #fffaf0;
    --dot-mid: #ece0c4;
    --dot-lo: #c9b98f;
    --dot-cast: rgba(90,72,38,.28);
    --dot-rim-hi: rgba(255,255,255,.7);
    --dot-empty: rgba(120,98,52,.16);
    --dot-empty-rim: rgba(255,250,238,.5);
    --ink: #8d7f63;
    --ctl: rgba(110,98,72,.6);
    --ctl-strong: #5a4b30;
  }
  :root[data-theme="kraft"] {
    /* 2. Kraft / manila: tan card stock, deeper warm shadow */
    --paper-1: #d9bd92;
    --paper-2: #cdac7e;
    --paper-3: #bd9a69;
    --paper-glow: rgba(255,244,222,.5);
    --grain-a: rgba(90,64,28,.05);
    --grain-b: rgba(90,64,28,.04);
    --dot-hi: #f4e3c5;
    --dot-mid: #cdaa78;
    --dot-lo: #936f41;
    --dot-cast: rgba(70,48,18,.42);
    --dot-rim-hi: rgba(255,248,232,.75);
    --dot-empty: rgba(80,54,22,.24);
    --dot-empty-rim: rgba(255,246,224,.5);
    --ink: #6e5532;
    --ctl: rgba(95,72,40,.7);
    --ctl-strong: #3f2f16;
  }
  :root[data-theme="blueprint"] {
    /* 3. Blueprint: deep blue paper, pale embossed dots that read like chalk */
    --paper-1: #1a3a78;
    --paper-2: #163267;
    --paper-3: #102650;
    --paper-glow: rgba(150,190,255,.18);
    --grain-a: rgba(210,225,255,.05);
    --grain-b: rgba(210,225,255,.04);
    --dot-hi: #f3f7ff;
    --dot-mid: #b9ccef;
    --dot-lo: #5d7cb4;
    --dot-cast: rgba(4,14,40,.55);
    --dot-rim-hi: rgba(255,255,255,.85);
    --dot-empty: rgba(0,8,30,.40);
    --dot-empty-rim: rgba(190,212,255,.30);
    --ink: #b8caec;
    --ctl: rgba(190,210,250,.7);
    --ctl-strong: #eef4ff;
  }
  :root[data-theme="contrast"] {
    /* 4. High-Contrast: near-black card, bright raised dots, maximum legibility */
    --paper-1: #0a0b0d;
    --paper-2: #060708;
    --paper-3: #000000;
    --paper-glow: rgba(255,255,255,.06);
    --grain-a: rgba(255,255,255,.02);
    --grain-b: rgba(255,255,255,.015);
    --dot-hi: #ffffff;
    --dot-mid: #e8edf2;
    --dot-lo: #9aa4ae;
    --dot-cast: rgba(0,0,0,.85);
    --dot-rim-hi: rgba(255,255,255,.95);
    --dot-empty: rgba(0,0,0,.6);
    --dot-empty-rim: rgba(255,255,255,.22);
    --ink: #d6dde4;
    --ctl: rgba(220,228,236,.75);
    --ctl-strong: #ffffff;
  }
  :root[data-theme="slate"] {
    /* 5. Slate: cool grey-blue stock, cool dome slightly lighter than the paper */
    --paper-1: #2f3742;
    --paper-2: #28303a;
    --paper-3: #20262f;
    --paper-glow: rgba(160,185,215,.14);
    --grain-a: rgba(190,205,230,.03);
    --grain-b: rgba(190,205,230,.022);
    --dot-hi: #b9c6d6;
    --dot-mid: #6e7c8c;
    --dot-lo: #3a434f;
    --dot-cast: rgba(0,0,0,.55);
    --dot-rim-hi: rgba(225,235,248,.8);
    --dot-empty: rgba(0,0,0,.34);
    --dot-empty-rim: rgba(180,200,225,.22);
    --ink: #aeb9c8;
    --ctl: rgba(190,202,220,.7);
    --ctl-strong: #e7edf6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    min-height: 100dvh;
    overflow: hidden;
    display: grid;
    place-items: center;
    padding: calc(env(safe-area-inset-top) + 6vmin) 5vmin calc(env(safe-area-inset-bottom) + 6vmin);
    color: var(--ink);
    font-family: 'Atkinson Hyperlegible', ui-sans-serif, system-ui, -apple-system, sans-serif;
    /* the whole page IS the paper: a soft top-left light, faint grain */
    background:
      radial-gradient(120% 100% at 28% 12%, var(--paper-glow), transparent 60%),
      repeating-linear-gradient(0deg, var(--grain-a) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, var(--grain-b) 0 1px, transparent 1px 4px),
      linear-gradient(155deg, var(--paper-1) 0%, var(--paper-2) 56%, var(--paper-3) 100%);
    transition: color .35s ease;
  }

  .sheet {
    --cell: clamp(30px, 8vw, 58px);   /* width of one braille cell (2 dot columns) */
    --dot: calc(var(--cell) * 0.40);
    display: grid;
    justify-items: center;
    gap: clamp(16px, 3vh, 28px);
  }

  /* the cells row */
  .cells {
    display: flex;
    align-items: center;
    gap: calc(var(--cell) * 0.34);
  }
  .group { display: flex; gap: calc(var(--cell) * 0.28); }

  .cell {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(3, 1fr);
    grid-auto-flow: column;             /* DOM order 1..6 -> dot positions 1..6 */
    gap: calc(var(--cell) * 0.18);
    width: var(--cell);
    height: calc(var(--cell) * 1.5);
  }
  /* a dot slot: an un-embossed slot reads as a faint recessed dimple, so the
     2x3 cell structure stays legible (helpful for anyone learning braille);
     when ON, a raised bump is stamped up over it. */
  .dot {
    position: relative;
    width: var(--dot);
    height: var(--dot);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, var(--dot-empty), transparent 70%);
    box-shadow: inset 0 1px 1.5px var(--dot-empty), inset 0 -1px 1px var(--dot-empty-rim);
  }
  /* the raised, embossed bump (only painted when .on) */
  .dot::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    /* paper-coloured dome: highlight top-left, shadow bottom-right */
    background:
      radial-gradient(circle at 36% 30%, var(--dot-hi) 0%, var(--dot-mid) 52%, var(--dot-lo) 100%);
    box-shadow:
      -0.5px -0.5px 1px var(--dot-rim-hi) inset,
      1px 1.5px 2px var(--dot-cast) inset,
      1.5px 2px 3px var(--dot-cast);   /* tiny cast shadow on the paper */
    opacity: 0;
    transform: scale(0);
    transition: transform .22s cubic-bezier(.2,1.3,.4,1), opacity .18s ease;
  }
  .dot.on::after { opacity: 1; transform: scale(1); }

  /* understated group labels under the cells */
  .labels {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--cell) * 0.34);
    width: 100%;
  }
  .labels .lab {
    display: flex;
    justify-content: center;
    flex: none;
    /* one group spans number-sign + two digit cells (3 cells, 2 inner gaps) */
    width: calc(var(--cell) * 3 + var(--cell) * 0.56);
    font-size: clamp(9px, 1.2vw, 11px);
    letter-spacing: .3em;
    text-indent: .3em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: .55;
  }

  .help {
    position: fixed;
    top: calc(env(safe-area-inset-top) + .4rem); right: .5rem; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px;
    color: var(--ctl); text-decoration: none;
    font-weight: 600; font-size: 18px; line-height: 1;
    transition: color .25s ease;
  }
  .help:hover, .help:focus-visible { color: var(--ctl-strong); }
  .help:focus-visible { outline: 2px solid var(--ctl-strong); outline-offset: 3px; border-radius: 4px; }

  /* paper cycle button: unobtrusive, bottom-left, keyboard-reachable */
  .toggle {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + .4rem); left: .5rem; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px;
    background: none; border: 0; cursor: pointer;
    color: var(--ctl);
    font-family: inherit; font-weight: 600; font-size: 18px; line-height: 1;
    transition: color .25s ease;
  }
  .toggle:hover, .toggle:focus-visible { color: var(--ctl-strong); }
  .toggle:focus-visible { outline: 2px solid var(--ctl-strong); outline-offset: 3px; border-radius: 4px; }

  /* the current paper's name, shown briefly on change then faded out */
  .theme-name {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + .8rem); left: 50%;
    transform: translateX(-50%);
    z-index: 30; pointer-events: none;
    font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--ctl-strong);
    opacity: 0; transition: opacity .4s ease;
  }
  .theme-name.show { opacity: .8; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* 10-foot / 4K: grow the braille cell beyond its clamp cap and bump the
     fixed-px chrome so the sheet reads from across the room */
  @media (min-width: 1900px), (min-height: 1900px) {
    .sheet { --cell: 86px; }
    .labels .lab { font-size: 16px; }
    .help, .toggle { font-size: 27px; min-width: 60px; min-height: 60px; }
    .theme-name { font-size: 16px; }
  }
</style>

    <div class="cells" aria-hidden="true">
      <div class="group" id="g-h"></div>
      <div class="group" id="g-m"></div>
      <div class="group" id="g-s"></div>
    </div>

    <div class="labels" aria-hidden="true">
      <span class="lab">Hours</span>

  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  'use strict';

  // ---- paper theme: cycle through five clearly-legible papers, persisted.
  var root = document.documentElement;
  var STORE = 'brailler-theme';
  var THEMES = [
    { id: 'cream',     name: 'Cream' },
    { id: 'kraft',     name: 'Kraft' },
    { id: 'blueprint', name: 'Blueprint' },
    { id: 'contrast',  name: 'High Contrast' },
    { id: 'slate',     name: 'Slate' }
  ];
  function indexOfTheme(id) {
    for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === id) return i;
    return -1;
  }
  // The paper is fixed (no cycling, no button). Honour a previously stored
  // choice if present, otherwise the first paper.
  function applyTheme(i) {
    var t = THEMES[((i % THEMES.length) + THEMES.length) % THEMES.length];
    root.setAttribute('data-theme', t.id);
    return t.id;
  }
  var stored = null;
  try { stored = localStorage.getItem(STORE); } catch (e) {}
  var current = indexOfTheme(stored);
  if (current < 0) current = 1;   // default: kraft manila paper
  applyTheme(current);

  // ---------------------------------------------------------------------------
  // BRAILLE ACCURACY REFERENCE (verified against the Unified English Braille
  // spec; do not regress). A cell is 6 dots, numbered by physical position:
  //       1 4        <- top    (col1/row1 , col2/row1)
  //       2 5        <- middle (col1/row2 , col2/row2)
  //       3 6        <- bottom (col1/row3 , col2/row3)
  // DOM/grid mapping: the .cell grid is 2 cols x 3 rows with
  // grid-auto-flow:column, so the 6 dot spans fill col1 top->bottom
  // (DOM 0,1,2 = positions 1,2,3) then col2 top->bottom (DOM 3,4,5 =
  // positions 4,5,6). setCell() lights DOM index i for position i+1.
  //
  // Number sign = dots 3,4,5,6 (rendered once per group, before the digits).
  // Digits are the letters a..j PRECEDED by that number sign:
  //   1=a=[1]      2=b=[1,2]    3=c=[1,4]    4=d=[1,4,5]  5=e=[1,5]
  //   6=f=[1,2,4]  7=g=[1,2,4,5] 8=h=[1,2,5]  9=i=[2,4]    0=j=[2,4,5]
  // (Note 0=j=[2,4,5] and 4=d=[1,4,5] -- the two commonly mis-encoded ones --
  //  are verified correct here.)
  // ---------------------------------------------------------------------------
  var DIGIT = {
    '1': [1],        '2': [1,2],      '3': [1,4],      '4': [1,4,5],
    '5': [1,5],      '6': [1,2,4],    '7': [1,2,4,5],  '8': [1,2,5],
    '9': [2,4],      '0': [2,4,5]
  };
  var NUMSIGN = [3,4,5,6];   // the number sign that precedes a run of digits

  // ---- build a cell of 6 dot slots. OFF slots draw nothing on the paper.
  function buildCell(parent, isSign) {
    var cell = document.createElement('div');
    cell.className = 'cell' + (isSign ? ' numsign' : '');
    var dots = [];
    for (var i = 0; i < 6; i++) {
      var el = document.createElement('span');
      el.className = 'dot';
      cell.appendChild(el);
      dots.push(el);
    }
    parent.appendChild(cell);
    return dots;
  }

  // stamp a cell to `positions`: ON dots rise, OFF dots flatten away.
  function setCell(dots, positions) {
    for (var i = 0; i < 6; i++) {
      dots[i].classList.toggle('on', positions.indexOf(i + 1) !== -1);
    }
  }

  function numGroup(id) {
    var g = document.getElementById(id);
    setCell(buildCell(g, true), NUMSIGN);   // leading number sign (fixed)
    return [buildCell(g, false), buildCell(g, false)];
  }
  var cellsH = numGroup('g-h');
  var cellsM = numGroup('g-m');
  var cellsS = numGroup('g-s');

  var sr = document.getElementById('sr');
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  var lastH = '', lastM = '', lastS = '', lastMin = -1, lastSec = -1;

  // (re)stamp a two-cell pair only if it changed.
  function writePair(cells, str, prev) {
    if (str === prev) return prev;
    setCell(cells[0], DIGIT[str[0]]);
    setCell(cells[1], DIGIT[str[1]]);
    return str;
  }

  function tick() {
    var now = new Date();
    var hh = now.getHours(), mm = now.getMinutes(), ss = now.getSeconds();
    if (ss === lastSec) return;
    lastSec = ss;
    var H = pad(hh), M = pad(mm), S = pad(ss);
    lastH = writePair(cellsH, H, lastH);
    lastM = writePair(cellsM, M, lastM);
    lastS = writePair(cellsS, S, lastS);
    if (mm !== lastMin) {
      lastMin = mm;
      sr.textContent = H + ':' + M + ' local time, in Braille.';
    }
  }

  // simple per-second update, drift-free, paused while hidden
  var timer = null;
  function start() {
    if (timer) clearInterval(timer);
    tick();
    timer = setInterval(tick, 250);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (timer) { clearInterval(timer); timer = null; }
    } else if (!timer) {
      start();
    }
  });

  start();
})();
</script>
<script>window.aboutClock = {
  title: 'Braille',
  board: { label: 'Ciphers', href: '/clocks/numerals/' },
  body: '<p>Braille punched into a sheet of paper, dots stamped up out of the page the way a Perkins brailler does it. The time runs in three groups: hours, minutes, seconds. Each group opens with a number sign (four raised dots) meaning &#39;digits ahead&#39;, then two cells spell the pair. The letters a through j are 1 through 9 and 0, so one dot is 1 and the j pattern is 0.</p>'
      + '<p>Louis Braille published the system in 1829 at nineteen, reworking a military code for reading in the dark into a six-dot cell. The Perkins Brailler, the heavy machine that embosses these dots, came a century later in 1951 and is still in classrooms today.</p>'
      + '<p>Empty dot slots stay as faint dimples instead of vanishing, so you can still see the full two-by-three frame of every cell and learn to read it.</p>'
};</script>
