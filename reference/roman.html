<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in Roman numerals, carved into pale marble. The hour, minute and second are each written with the letters I, V, X, L and C in the usual additive and subtractive style, separated by colons. The exact time is shown beneath and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);

  var INK = 'rgba(56,51,44,0.94)';
  var HILITE = 'rgba(255,251,240,0.85)';   // lit lower edge of an incised cut
  var RED = 'rgba(154,74,54,0.92)';        // rubricated colons

  // --------------------------------------------------------------------------
  // ROMAN NUMERALS, additive + subtractive. Values here never exceed 59, so the
  // letters I (1) V (5) X (10) L (50) and the IV/IX/XL contractions are enough.
  // There is no zero in Roman counting; a bare midpoint dot stands in for it.
  // --------------------------------------------------------------------------
  var MAP = [[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  function toRoman(n) {
    if (n === 0) return '·';
    var r = '';
    for (var i = 0; i < MAP.length; i++) { while (n >= MAP[i][0]) { r += MAP[i][1]; n -= MAP[i][0]; } }
    return r;
  }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // widest Roman numeral that can ever appear for a given max value (used to lock column widths)
  function widestRoman(maxVal) {
    var w = ''; for (var n=0;n<=maxVal;n++){ var r=toRoman(n); if(r.length>w.length)w=r; } return w;
  }
  var W_H = widestRoman(23), W_M = widestRoman(59), W_S = widestRoman(59);

  // --------------------------------------------------------------------------
  // CANVAS SIZING (DPR-aware)
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // --------------------------------------------------------------------------
  // RENDER: three numerals (H : M : S) carved across pale marble, colons in a
  // faded inscription red, the plain time engraved small beneath.
  // --------------------------------------------------------------------------
  var lastSR = -1;

  function paint() {
    var g = ctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
    g.addColorStop(0, '#edece6');
    g.addColorStop(1, '#d3d0c6');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // engraved text: a light copy nudged down-right (the lit edge) then dark on top
  function carve(text, x, y, px, color) {
    ctx.font = '600 ' + px + 'px Cinzel, Georgia, serif';
    ctx.fillStyle = HILITE;
    ctx.fillText(text, x + Math.max(1, px * 0.02), y + Math.max(1, px * 0.03));
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  function tick() {
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();

    paint();

    var parts = [toRoman(h), toRoman(m), toRoman(s)];

    if (H > W * 1.05) {
      // portrait: three fixed-width columns stacked (H over M over S)
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var px = Math.max(18, Math.min(W * 0.30, H * 0.16));
      ctx.font = '600 ' + px + 'px Cinzel, Georgia, serif';
      var colW = Math.max(ctx.measureText(W_H).width, ctx.measureText(W_M).width, ctx.measureText(W_S).width);
      var rowGap = px * 1.55;
      var cyMid = H / 2 - (embedded ? 0 : px * 0.5);
      carve(parts[0], W / 2, cyMid - rowGap, px, INK);
      carve(parts[1], W / 2, cyMid, px, INK);
      carve(parts[2], W / 2, cyMid + rowGap, px, INK);
      if (!embedded) {
        var dpx = Math.max(13, Math.round(px * 0.3));
        ctx.font = '600 ' + dpx + 'px "JetBrains Mono", monospace';
        ctx.fillStyle = 'rgba(64,55,42,0.5)';
        ctx.fillText(pad2(h) + ' : ' + pad2(m) + ' : ' + pad2(s), W / 2, cyMid + rowGap + px * 0.95);
      }
    } else {
      // landscape: one engraved line with fixed column widths
      var sep = '  ·  ';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      var px = Math.max(20, Math.min(H * 0.28, W * 0.15));
      ctx.font = '600 ' + px + 'px Cinzel, Georgia, serif';
      var colW = Math.max(ctx.measureText(W_H).width, ctx.measureText(W_M).width, ctx.measureText(W_S).width);
      var sepW = ctx.measureText(sep).width;
      var total = colW*3 + sepW*2;
      var x = W / 2 - total / 2;
      var cy = H / 2 - (embedded ? 0 : px * 0.34);
      // hour column
      ctx.textAlign = 'center';
      carve(parts[0], x + colW/2, cy, px, INK);
      x += colW;
      carve(sep, x, cy, px, RED); x += sepW;
      // minute column
      carve(parts[1], x + colW/2, cy, px, INK);
      x += colW;
      carve(sep, x, cy, px, RED); x += sepW;
      // second column
      carve(parts[2], x + colW/2, cy, px, INK);
      if (!embedded) {
        var dpx = Math.max(13, Math.round(px * 0.26));
        ctx.textAlign = 'center';
        ctx.font = '600 ' + dpx + 'px "JetBrains Mono", monospace';
        ctx.fillStyle = 'rgba(64,55,42,0.5)';
        ctx.fillText(pad2(h) + ' : ' + pad2(m) + ' : ' + pad2(s), W / 2, cy + px * 0.72);
      }
    }

    if (m !== lastSR) {
      lastSR = m;
      sr.textContent = pad2(h) + ':' + pad2(m) + ' local time, in Roman numerals (' +
        toRoman(h) + ' ' + toRoman(m) + ').';
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  resize();
  start();
})();
</script>

  title: 'Roman Numerals',
  board: { label: 'Ciphers', href: '/clocks/numerals/' },
  body: '<p>Roman numerals are counting with letters, I is one, V is five, X is ten, then L and C carry you farther. Most of the time you add left to right, but a small mark in front of a bigger one subtracts, so IV is four and IX is nine.</p>'
      + '<p>Here the hour, minute, and second are each carved out in that style, with a middle dot as a stand in for zero. The plain time sits nearby so you can relax your forehead.</p>'
      + '<p>I love that Rome had no zero, which means this clock solves the problem with a dot, the same shape I make when asked to do Roman numeral math in my head.</p>'
      + '<p class="about-map"><a href="https://en.wikipedia.org/wiki/Roman_numerals" target="_blank" rel="noopener">Roman numerals</a></p>'
};</script>
