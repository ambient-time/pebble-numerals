<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in tally marks. Hours, minutes and seconds are each counted out in gate-of-five strokes scratched onto paper, where every fifth mark strikes diagonally across the previous four. The exact time is shown beside each row and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);

  var INK = 'rgba(40,44,54,0.9)';
  var LABEL = ['HOURS', 'MINUTES', 'SECONDS'];
  var MAXGATES = 12;                              // 59 -> 11 gates + 4 strokes

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // --------------------------------------------------------------------------
  // CANVAS SIZING (DPR-aware)
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // deterministic per-mark jitter so strokes look hand-scratched but stable
  function jit(seed) { var x = Math.sin(seed * 12.9898) * 43758.5453; return (x - Math.floor(x)) - 0.5; }

  // one tally stroke, scratched by an impatient hand: the top and bottom drift
  // independently so the stroke leans at its own angle, the length overshoots a
  // little, the middle bows, and the nib presses harder or softer each time.
  function stroke(x, y0, y1, seed, lw) {
    var tiltT = jit(seed) * lw * 4.5;              // top end wanders
    var tiltB = jit(seed + 17) * lw * 4.5;         // bottom end wanders the other way -> a lean
    var bow = jit(seed + 9) * lw * 3.0;            // sideways bow through the middle
    var over0 = jit(seed + 3) * lw * 3.5;          // overshoot past the top
    var over1 = jit(seed + 5) * lw * 3.5;          // overshoot past the bottom
    ctx.lineWidth = lw * (0.7 + Math.abs(jit(seed + 11)) * 0.9);   // nib pressure varies
    ctx.beginPath();
    ctx.moveTo(x + tiltT, y0 - over0);
    ctx.quadraticCurveTo(x + bow, (y0 + y1) / 2, x + tiltB, y1 + over1);
    ctx.stroke();
  }

  var lastSR = -1;

  function paint() {
    ctx.fillStyle = '#efeada'; ctx.fillRect(0, 0, W, H);
    // faint ruled line under each row drawn later; light paper grain skipped for speed
  }

  // render a count as gates of five, left-aligned within the row band
  function drawCount(n, x0, cy, gw, h, lw) {
    var gates = Math.floor(n / 5), rem = n % 5;
    var sp = gw * 0.16;                            // stroke spacing inside a gate
    var x = x0;
    ctx.strokeStyle = INK; ctx.lineCap = 'round';
    for (var g = 0; g < gates; g++) {
      for (var k = 0; k < 4; k++) stroke(x + k * sp, cy - h / 2, cy + h / 2, g * 31 + k * 7 + 3, lw);
      // the fifth: a diagonal slash flung across the four, its own wild angle each gate
      var sj = jit(g * 53 + 7) * sp * 1.2;
      ctx.lineWidth = lw * (1.05 + Math.abs(jit(g * 19)) * 0.5);
      ctx.beginPath();
      ctx.moveTo(x - sp * 0.6 + sj, cy + h / 2 * (0.82 + jit(g * 7) * 0.28));
      ctx.quadraticCurveTo(x + sp * 1.5 + jit(g * 23) * sp, cy + jit(g * 29) * h * 0.12,
                           x + sp * 3.6 + sj, cy - h / 2 * (0.82 + jit(g * 11) * 0.28));
      ctx.stroke();
      x += gw;
    }
    for (var r = 0; r < rem; r++) stroke(x + r * sp, cy - h / 2, cy + h / 2, 200 + r * 13, lw);
  }

  function tick() {
    var now = new Date();
    var vals = [now.getHours(), now.getMinutes(), now.getSeconds()];

    paint();

    var rowGap = Math.min(H * 0.26, W * 0.6);
    var cy0 = H / 2 - rowGap;
    var gw = (W * (embedded ? 0.94 : 0.7)) / MAXGATES;
    var mh = Math.min(rowGap * 0.66, gw * 2.4);    // taller strokes
    var lw = Math.max(2.5, gw * 0.085);            // heavier nib
    var sp = gw * 0.16;

    for (var i = 0; i < 3; i++) {
      var cy = cy0 + i * rowGap;
      // rows align left from a common margin, the way you actually tally on paper
      // (standalone keeps the value/label on the right).
      var x0 = W * 0.06;
      drawCount(vals[i], x0, cy, gw, mh, lw);

      if (!embedded) {
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        var dpx = Math.max(13, Math.round(mh * 0.42));
        ctx.font = '600 ' + dpx + 'px "JetBrains Mono", monospace';
        ctx.fillStyle = 'rgba(53,80,112,0.85)';
        ctx.fillText(pad2(vals[i]), W * 0.95, cy - dpx * 0.5);
        ctx.fillStyle = 'rgba(40,44,54,0.4)';
        ctx.font = '600 ' + Math.round(dpx * 0.52) + 'px "JetBrains Mono", monospace';
        ctx.fillText(LABEL[i], W * 0.95, cy + dpx * 0.55);
      }
    }

    if (now.getMinutes() !== lastSR) {
      lastSR = now.getMinutes();
      sr.textContent = pad2(vals[0]) + ':' + pad2(vals[1]) + ' local time, in tally marks.';
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  resize();
  start();
})();
</script>
<script>window.aboutClock = {
  title: 'Tally Marks',
  board: { label: 'Ciphers', href: '/clocks/numerals/' },
  body: '<p>This is counting the oldest way, one scratch per thing, bundled into fives so your eyes do not drown. Four strokes stand up, and the fifth slashes across them like a quick little fence.</p>'
      + '<p>Hours, minutes, and seconds each get their own row, so time becomes three running totals on paper. The plain numbers sit alongside, because nobody should have to recount seconds for fun.</p>'
      + '<p>If you decide to tally every second by hand, you will learn a valuable lesson, regret also comes in groups of five.</p>'
      + '<p class="about-map"><a href="https://en.wikipedia.org/wiki/Tally_marks" target="_blank" rel="noopener">Tally marks</a></p>'
};</script>
