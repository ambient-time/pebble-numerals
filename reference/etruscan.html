<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in Etruscan numerals. The hour, minute and second are each written with the pre-Roman additive marks for one, five, ten and fifty, ordered right to left, etched into weathered bronze. The exact time is shown beneath and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);

  var INK = 'rgba(245,238,224,0.95)';
  var HILITE = 'rgba(255,238,196,0.45)';

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // --------------------------------------------------------------------------
  // ETRUSCAN NUMERALS, additive, written right to left. Marks: 1 (vertical),
  // 5 (chevron), 10 (X), 50 (arrow). Decompose largest to smallest; values here
  // never exceed 59. There is no zero; a faint ring stands in for it.
  // --------------------------------------------------------------------------
  function glyphList(n) {
    var out = [];
    var f = Math.floor(n / 50); n -= 50 * f; while (f--) out.push(50);
    var x = Math.floor(n / 10); n -= 10 * x; while (x--) out.push(10);
    var v = Math.floor(n / 5); n -= 5 * v; while (v--) out.push(5);
    while (n-- > 0) out.push(1);
    return out;                                   // largest first
  }

  // draw a single mark centred in a box of side sz at (cx,cy)
  function glyph(type, cx, cy, sz, lw) {
    var h = sz * 0.46, w = sz * 0.32;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    function line(ax, ay, bx, by) {
      ctx.strokeStyle = HILITE; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(ax + lw * 0.4, ay + lw * 0.4); ctx.lineTo(bx + lw * 0.4, by + lw * 0.4); ctx.stroke();
      ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
    if (type === 1) {
      line(cx, cy - h, cx, cy + h);
    } else if (type === 5) {                       // chevron pointing up
      line(cx - w, cy + h, cx, cy - h);
      line(cx + w, cy + h, cx, cy - h);
    } else if (type === 10) {                      // X
      line(cx - w, cy - h, cx + w, cy + h);
      line(cx + w, cy - h, cx - w, cy + h);
    } else if (type === 50) {                      // vertical with an up-arrow head
      line(cx, cy - h, cx, cy + h);
      line(cx - w * 0.7, cy - h * 0.45, cx, cy - h);
      line(cx + w * 0.7, cy - h * 0.45, cx, cy - h);
    }
  }

  // --------------------------------------------------------------------------
  // CANVAS SIZING (DPR-aware)
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  var lastSR = -1;

  function tick() {
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();

    var bg = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
    bg.addColorStop(0, '#a8533d'); bg.addColorStop(1, '#7a382a');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    var groups = [glyphList(h), glyphList(m), glyphList(s)];
    var maxCount = Math.max(1, groups[0].length, groups[1].length, groups[2].length);

    if (H > W * 1.05) {
      // portrait: three rows, hours over minutes over seconds, each right-to-left
      var sz = 0.85 * Math.min(H * 0.2, (W * 0.86) / ((maxCount - 1) * 0.44 + 0.6));
      var adv = sz * 0.44;
      var lw = Math.max(2.5, sz * 0.05);
      var rowGap = sz * 1.5;
      var cyMid = H / 2 - (embedded ? 0 : sz * 0.5);
      for (var i = 0; i < 3; i++) {
        var rcy = cyMid + (i - 1) * rowGap;
        var list = groups[i];
        if (list.length === 0) {
          ctx.strokeStyle = 'rgba(245,238,224,0.32)'; ctx.lineWidth = lw;
          ctx.beginPath(); ctx.arc(W / 2, rcy, sz * 0.18, 0, Math.PI * 2); ctx.stroke();
          continue;
        }
        var total = (list.length - 1) * adv;
        var xRight = W / 2 + total / 2;
        for (var k = 0; k < list.length; k++) glyph(list[k], xRight - k * adv, rcy, sz, lw);
      }
      if (!embedded) {
        var dpx = Math.max(13, Math.round(sz * 0.34));
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '600 ' + dpx + 'px "JetBrains Mono", monospace';

        ctx.fillText(pad2(h) + ' : ' + pad2(m) + ' : ' + pad2(s), W / 2, cyMid + rowGap + sz * 0.9);
      }
    } else {
      // landscape: three clusters side by side
      var cols = [W * 0.22, W * 0.5, W * 0.78];
      var sz = Math.min(H * 0.4, (W * 0.28) / Math.max(3, maxCount) * 2.4);
      var adv = sz * 0.44;
      var lw = Math.max(2.5, sz * 0.05);
      var cy = H / 2 - (embedded ? 0 : sz * 0.34);
      for (var i = 0; i < 3; i++) {
        var list = groups[i];
        if (list.length === 0) {                     // zero -> faint ring
          ctx.strokeStyle = 'rgba(245,238,224,0.32)'; ctx.lineWidth = lw;
          ctx.beginPath(); ctx.arc(cols[i], cy, sz * 0.18, 0, Math.PI * 2); ctx.stroke();
          continue;
        }
        // right to left: largest glyph at the right edge of the cluster
        var total = (list.length - 1) * adv;
        var xRight = cols[i] + total / 2;
        for (var k = 0; k < list.length; k++) glyph(list[k], xRight - k * adv, cy, sz, lw);
      }
      if (!embedded) {
        var dpx = Math.max(13, Math.round(sz * 0.2));
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '600 ' + dpx + 'px "JetBrains Mono", monospace';
        ctx.fillStyle = 'rgba(58,168,144,0.72)';
        ctx.fillText(pad2(h) + ' : ' + pad2(m) + ' : ' + pad2(s), W / 2, cy + sz * 0.62);
      }
    }

    if (m !== lastSR) {
      lastSR = m;
      sr.textContent = pad2(h) + ':' + pad2(m) + ' local time, in Etruscan numerals.';
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  resize();
  start();
})();
