<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in Aztec vigesimal numerals. Hours, minutes and seconds are each shown with banners for twenties and dots for ones, brushed onto amate bark paper. The exact time is shown beside each row and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);

  var INK = '#3a2614';                           // codex outline brown-black
  var DOT = '#b9542c';                           // cacao-red ones
  var BANNER = '#1c8a84';                         // Aztec turquoise (xihuitl) flag
  var RED = '#a8351f';                            // cochineal accent
  var LABEL = ['HOURS', 'MINUTES', 'SECONDS'];

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // --------------------------------------------------------------------------
  // CANVAS SIZING (DPR-aware)
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  var lastSR = -1;

  function paint() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#f1ddb2');
    g.addColorStop(1, '#e2c684');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // amate bark: faint fibrous streaks, deterministic so they stay put
    ctx.lineWidth = 1;
    for (var i = 0; i < W; i += 6) {
      var a = Math.sin(i * 0.93) * 0.5 + 0.5;
      ctx.strokeStyle = 'rgba(120,86,44,' + (0.03 + a * 0.04).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(i + Math.sin(i) * 3, 0);
      ctx.lineTo(i + Math.sin(i * 1.7) * 7, H);
      ctx.stroke();
    }
  }

  // a pantli banner, worth twenty: a pole with a finial and a stepped turquoise
  // cloth bearing a little step-fret, outlined the way a codex scribe would.
  function banner(cx, cy, sz) {
    var px = cx - sz * 0.46, top = cy - sz * 0.66, bot = cy + sz * 0.66;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // pole
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(2, sz * 0.11);
    ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, bot); ctx.stroke();
    // finial knob
    ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(px, top, sz * 0.12, 0, Math.PI * 2); ctx.fill();
    // cloth with a stepped (step-fret) lower fly
    var fx = px, fy = top + sz * 0.06, fw = sz * 0.92, fh = sz * 0.78;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + fw, fy);
    ctx.lineTo(fx + fw, fy + fh * 0.58);
    ctx.lineTo(fx + fw * 0.66, fy + fh * 0.58);
    ctx.lineTo(fx + fw * 0.66, fy + fh);
    ctx.lineTo(fx + fw * 0.34, fy + fh);
    ctx.lineTo(fx + fw * 0.34, fy + fh * 0.58);
    ctx.lineTo(fx, fy + fh * 0.58);
    ctx.closePath();
    ctx.fillStyle = BANNER; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.4, sz * 0.05); ctx.stroke();
    // step-fret accent square
    ctx.fillStyle = 'rgba(241,221,178,0.9)';
    ctx.fillRect(fx + fw * 0.14, fy + fh * 0.16, fw * 0.22, fh * 0.24);
    ctx.fillStyle = RED;
    ctx.fillRect(fx + fw * 0.14, fy + fh * 0.16, fw * 0.11, fh * 0.12);
  }

  // a codex dot worth one: an outlined disc with a cacao body and a soft highlight
  function dot(cx, cy, r) {
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = DOT; ctx.beginPath(); ctx.arc(cx, cy, r * 0.76, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,244,224,0.55)';
    ctx.beginPath(); ctx.arc(cx - r * 0.26, cy - r * 0.26, r * 0.26, 0, Math.PI * 2); ctx.fill();
  }

  // ones as dots, grouped in fives with a small gap
  function drawAztec(n, x0, cy, unit, dotR) {
    var twenties = Math.floor(n / 20), ones = n % 20;
    var x = x0;
    for (var b = 0; b < twenties; b++) { banner(x + unit * 0.5, cy, unit * 0.92); x += unit * 1.3; }
    if (twenties && ones) x += unit * 0.34;
    for (var o = 0; o < ones; o++) {
      dot(x + dotR, cy, dotR);
      x += dotR * 2.5;
      if ((o + 1) % 5 === 0) x += dotR * 1.4;       // gap every five
    }
  }

  function tick() {
    var now = new Date();
    var vals = [now.getHours(), now.getMinutes(), now.getSeconds()];

    paint();

    var rowGap = Math.min(H * 0.27, W * 0.6);
    var cy0 = H / 2 - rowGap;
    // worst case width: 2 banners + 19 dots in groups -> size dots to fit
    var avail = W * (embedded ? 0.9 : 0.66);
    var dotR = Math.min(avail / 64, rowGap * 0.16);
    var unit = dotR * 3.6;

    for (var i = 0; i < 3; i++) {
      var cy = cy0 + i * rowGap;
      // centre each row in embed tiles (no labels there)
      var tw = Math.floor(vals[i] / 20), on = vals[i] % 20;
      var rowW = tw * unit * 1.25 + (tw && on ? unit * 0.3 : 0) + on * dotR * 2.5 + Math.floor(on / 5) * dotR * 1.4;
      var x0 = embedded ? Math.max(W * 0.06, (W - rowW) / 2) : W * 0.06;
      drawAztec(vals[i], x0, cy, unit, dotR);
      if (!embedded) {
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        var dpx = Math.max(13, Math.round(rowGap * 0.2));
        ctx.font = '600 ' + dpx + 'px "JetBrains Mono", monospace';
        ctx.fillStyle = 'rgba(181,83,42,0.92)';
        ctx.fillText(pad2(vals[i]), W * 0.95, cy - dpx * 0.5);
        ctx.fillStyle = 'rgba(60,40,24,0.42)';
        ctx.font = '600 ' + Math.round(dpx * 0.52) + 'px "JetBrains Mono", monospace';
        ctx.fillText(LABEL[i], W * 0.95, cy + dpx * 0.55);
      }
    }

    if (now.getMinutes() !== lastSR) {
      lastSR = now.getMinutes();
      sr.textContent = pad2(vals[0]) + ':' + pad2(vals[1]) + ' local time, in Aztec numerals.';
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() { if (rafId) cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  resize();
  start();
})();
</script>
<script>window.aboutClock = {
  title: 'Aztec Numerals',
  board: { label: 'Ciphers', href: '/clocks/numerals/' },
  body: '<p>Aztec numerals count in twenties, a dot is one and a little banner stands for a whole twenty. '
      + 'So 47 is two banners and seven dots, with the dots grouped to make counting easier. Hours, minutes, and seconds each get a row, brushed onto bark paper with the plain value beside it.</p>'
      + '<p>Counting in twenties only feels strange until you remember nobody involved was wearing shoes.</p>'
      + '<p class="about-map">Source: <a href="https://en.wikipedia.org/wiki/Aztec_numerals" target="_blank" rel="noopener">Wikipedia</a>.</p>'
};</script>
