<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in real Tengwar numerals, Tolkien's flowing Elvish script, counting in base twelve. Hours, minutes and seconds are each two base-twelve digits, drawn as genuine Tengwar number signs. The exact time is shown beneath and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);
  var ACCENT = '#5cd9ff';
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // load the real Tengwar font; until it resolves (or if it fails) we fall back to
  // base-twelve digits (A and B for ten and eleven) so the clock is never unreadable.
  var fontReady = false;
  if (document.fonts && document.fonts.load) {
    document.fonts.load('48px "Alcarin"').then(function () { fontReady = document.fonts.check('48px "Alcarin"'); }).catch(function () {});
  }

  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // one base-twelve Tengwar numeral (0..11), drawn from the real font. Decimal
  // digits 0..9 sit at U+E070..E079; the duodecimal ten and eleven at U+E07A,E07B.
  // `size` is the glyph height in px. Falls back to base-twelve digits until loaded.
  function digit(cx, cy, d, size) {
    ctx.fillStyle = ACCENT;
    ctx.shadowColor = 'rgba(92,217,255,0.5)'; ctx.shadowBlur = size * 0.2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (fontReady) {
      var cp = d <= 9 ? 0xE070 + d : (d === 10 ? 0xE07A : 0xE07B);
      ctx.font = Math.round(size) + 'px "Alcarin", serif';
      ctx.fillText(String.fromCharCode(cp), cx, cy);
    } else {
      ctx.font = '600 ' + Math.round(size * 0.62) + 'px "JetBrains Mono", monospace';
      ctx.fillText(d <= 9 ? String(d) : (d === 10 ? 'A' : 'B'), cx, cy);
    }
    ctx.shadowBlur = 0;
  }

  var lastSR = -1;
  function tick() {
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    ctx.fillStyle = '#04101a'; ctx.fillRect(0, 0, W, H);

    var units = [h, m, s], digs = [];
    for (var k = 0; k < 3; k++) { digs.push(Math.floor(units[k] / 12)); digs.push(units[k] % 12); }
    var readout = pad2(h) + ' : ' + pad2(m) + ' : ' + pad2(s);

    if (H > W * 1.05) {
      // portrait: three stacked rows, hours over minutes over seconds
      var G = Math.min(W * 0.32, H * 0.19);
      var colGap = G * 0.86, rowGap = G * 1.34, cx = W / 2;
      var cyMid = H / 2 - (embedded ? G * 0.05 : G * 0.5);
      for (var r = 0; r < 3; r++) {
        var y = cyMid + (r - 1) * rowGap;
        digit(cx - colGap / 2, y, digs[r * 2], G);
        digit(cx + colGap / 2, y, digs[r * 2 + 1], G);
      }
      if (!embedded) {
        ctx.fillStyle = 'rgba(214,240,250,0.42)';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '600 ' + Math.max(13, Math.round(G * 0.26)) + 'px "JetBrains Mono", monospace';
        ctx.fillText(readout, cx, cyMid + rowGap + G * 0.86);
      }
    } else {
      // landscape: one row of six digits
      var G = Math.min(W * 0.12, H * 0.42);
      var cell = G * 0.82, gap = G * 0.5;
      var totalW = 6 * cell + 2 * gap;
      var x = W / 2 - totalW / 2 + cell / 2;
      var cy = H / 2 - (embedded ? 0 : G * 0.32);
      for (var i = 0; i < 6; i++) {
        digit(x, cy, digs[i], G);
        x += cell;
        if (i === 1 || i === 3) x += gap;
      }
      if (!embedded) {
        ctx.fillStyle = 'rgba(214,240,250,0.42)';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '600 ' + Math.max(13, Math.round(G * 0.24)) + 'px "JetBrains Mono", monospace';
        ctx.fillText(readout, W / 2, cy + G * 0.66);
      }
    }

    if (m !== lastSR) { lastSR = m; sr.textContent = pad2(h) + ':' + pad2(m) + ' local time, in Tengwar base-twelve.'; }
    requestAnimationFrame(tick);
  }
  resize(); tick();
})();
</script>
