<body>
  <canvas id="scene" role="img"
    aria-label="The current local 24-hour time written in balanced ternary. Three rows, the hour, the minute and the second, each show five trits with place values eighty-one, twenty-seven, nine, three and one. An up-pointing triangle is plus one, a down-pointing triangle is minus one, and a dash is zero. Each row is labelled with its two-digit decimal value, and the time is announced once a minute."></canvas>
  <a class="help" href="https://lukesteuber.com" aria-label="Luke Steuber's website">?</a>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');

  var CYAN = '#a78bfa';
  var AMBER = '#f5b441';

  // --------------------------------------------------------------------------
  // ENCODING: BALANCED TERNARY
  // Each number is a sum of powers of three (1, 3, 9, 27, 81) with each trit a
  // digit in {-1, 0, +1}. Conversion of n:
  //   while n != 0:
  //     r = ((n % 3) + 3) % 3
  //     r == 0 -> trit 0,  n /= 3
  //     r == 1 -> trit +1, n = (n - 1) / 3
  //     r == 2 -> trit -1, n = (n + 1) / 3
  // Collect least-significant first, then pad/align to a FIXED 5 trits so the
  // place columns (81, 27, 9, 3, 1) line up across the three rows. Index 0 of a
  // row is the most-significant trit (place 81); index 4 is place 1 (units).
  // --------------------------------------------------------------------------
  var WIDTH = 5;                       // 3^4 = 81 covers 0..59 (range +-121)
  var PLACES = [81, 27, 9, 3, 1];

  function toBalancedTernary(n) {
    // returns an array of length WIDTH, index 0 = most significant (place 81)
    var trits = [];                    // least significant first
    var v = n;
    while (v !== 0) {
      var r = ((v % 3) + 3) % 3;
      if (r === 0) { trits.push(0); v = v / 3; }
      else if (r === 1) { trits.push(1); v = (v - 1) / 3; }
      else { trits.push(-1); v = (v + 1) / 3; }
    }
    while (trits.length < WIDTH) trits.push(0);
    trits.reverse();                   // most significant first
    return trits;
  }

  // --------------------------------------------------------------------------
  // ANIMATION STATE: three rows (H, M, S), five trits each. Each trit morphs
  // its value over ~250ms when it changes, so a triangle grows/shrinks and the
  // colour shifts rather than snapping between states.
  // --------------------------------------------------------------------------
  var FLIP_MS = 250;
  var rows = [];
  for (var rIdx = 0; rIdx < 3; rIdx++) {
    var cells = [];
    for (var cIdx = 0; cIdx < WIDTH; cIdx++) cells.push({ from: 0, to: 0, t: 1, start: 0 });
    rows.push(cells);
  }
  var initialised = false;

  function setRow(rowIndex, value, nowMs) {
    var trits = toBalancedTernary(value);
    var cells = rows[rowIndex];
    for (var i = 0; i < WIDTH; i++) {
      var cell = cells[i];
      var target = trits[i];
      if (!initialised) {
        cell.from = cell.to = target; cell.t = 1;
      } else if (target !== cell.to) {
        cell.from = cell.to;
        cell.to = target;
        cell.t = 0;
        cell.start = nowMs;
      }
    }
  }

  function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

  // --------------------------------------------------------------------------
  // DRAW ONE TRIT
  // `v` is the interpolated value in [-1, 1]. We render the *resting* glyph for
  // sign(to) but scale/fade it by the eased progress so the change is smooth.
  //   +1 -> up triangle, bright cyan
  //   -1 -> down triangle, amber
  //    0 -> short horizontal dash, dim
  // During a flip we cross-fade the outgoing glyph out and the incoming in.
  // --------------------------------------------------------------------------
  function trianglePath(cx, cy, size, up) {
    var h = size;                      // half-height of the triangle
    ctx.beginPath();
    if (up) {
      ctx.moveTo(cx, cy - h);
      ctx.lineTo(cx + h * 0.95, cy + h * 0.75);
      ctx.lineTo(cx - h * 0.95, cy + h * 0.75);
    } else {
      ctx.moveTo(cx, cy + h);
      ctx.lineTo(cx + h * 0.95, cy - h * 0.75);
      ctx.lineTo(cx - h * 0.95, cy - h * 0.75);
    }
    ctx.closePath();
  }

  function drawGlyph(cx, cy, state, size, alpha) {
    // state: -1, 0, or +1 (a resting value). alpha scales opacity/scale.
    if (alpha <= 0.001) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (state === 0) {
      // a dim hollow dash for zero
      var dw = size * 0.9;
      ctx.strokeStyle = 'rgba(238,233,255,0.42)';
      ctx.lineWidth = Math.max(2, size * 0.16);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - dw, cy);
      ctx.lineTo(cx + dw, cy);
      ctx.stroke();
    } else {
      var up = state > 0;
      var col = up ? CYAN : AMBER;
      ctx.fillStyle = col;
      ctx.strokeStyle = col;
      ctx.lineJoin = 'round';
      ctx.shadowColor = up ? 'rgba(167,139,250,0.6)' : 'rgba(245,180,65,0.55)';
      ctx.shadowBlur = Math.max(6, size * 0.5);
      trianglePath(cx, cy, size * alpha, up);
      ctx.fill();
    }
    ctx.restore();
  }

  // --------------------------------------------------------------------------
  // CANVAS SIZING
  // --------------------------------------------------------------------------
  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width));
    H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // --------------------------------------------------------------------------
  // RENDER
  // --------------------------------------------------------------------------
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  var lastSR = -1;

  function tick() {
    var now = new Date();
    var nowMs = now.getTime();
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();

    setRow(0, h, nowMs);
    setRow(1, m, nowMs);
    setRow(2, s, nowMs);
    initialised = true;

    ctx.clearRect(0, 0, W, H);

    // In a gallery embed there is no place-value header, no decoded gutter and
    // no bottom caption, so the grid alone should centre on the tile. Standalone
    // keeps the header above and reserves a strip below for the caption.
    var embedded = (window.self !== window.top);

    // small reserve at the bottom for the faded caption (standalone only)
    var avail = embedded ? H : Math.max(160, H - 64);
    var base = Math.min(W, avail);

    // column / row geometry. 5 columns of trits plus a left label gutter.
    var colSpacing = Math.min(W / 6.2, base * 0.17);
    var rowSpacing = Math.min(avail / 4.0, base * 0.24);
    var glyph = Math.min(colSpacing, rowSpacing) * 0.34;     // triangle half-height
    var gridW = colSpacing * (WIDTH - 1);
    // Centre the WHOLE composition (left label gutter + 5 trit columns), not just
    // the grid, so it stays balanced at any aspect including a square viewport.
    // The gutter label sits at cx0 - GUTTER*colSpacing; the last column at
    // cx0 + (WIDTH-1)*colSpacing. Centre the midpoint of those extremes on W/2.
    // The gutter only holds the decoded values, which are hidden in gallery
    // embeds. When they are gone, drop the reserve so the trit columns centre on
    // W/2 instead of staying biased right by the empty gutter.
    var GUTTER = embedded ? 0 : 0.85;                        // gutter offset (in colSpacing) left of column 0
    var cx0 = W / 2 + (GUTTER - (WIDTH - 1)) * colSpacing / 2; // first column centre
    var gridH = rowSpacing * 2;                              // 3 rows, 2 gaps
    // Standalone biases the block down so the header above it balances on H/2;
    // an embed has no header, so the three rows centre on H/2 directly.
    var cyMid = embedded ? (H / 2) : (H / 2 + 0.36 * rowSpacing);
    var cy0 = cyMid - gridH / 2;
    var labelPx = Math.max(11, base * 0.026);

    // faint place-value header across the top of the grid (standalone only: it
    // is a reading aid, so embeds drop it and show the bare trit grid)
    if (!embedded) {
      ctx.save();
      ctx.fillStyle = 'rgba(238,233,255,0.32)';
      ctx.font = '400 ' + Math.round(labelPx * 0.92) + 'px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var headerY = cy0 - rowSpacing * 0.72;
      for (var p = 0; p < WIDTH; p++) {
        ctx.fillText(String(PLACES[p]), cx0 + p * colSpacing, headerY);
      }
      ctx.restore();
    }

    var rowVals = [h, m, s];
    for (var rr = 0; rr < 3; rr++) {
      var cy = cy0 + rr * rowSpacing;
      var cells = rows[rr];

      // decoded two-digit value at the left gutter (hours / minutes / seconds)
      if (window.self === window.top) {
      ctx.save();
      ctx.fillStyle = 'rgba(245,180,65,0.62)';
      ctx.font = '600 ' + Math.round(labelPx * 1.1) + 'px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pad2(rowVals[rr]), cx0 - colSpacing * GUTTER, cy);
      ctx.restore();
      }

      for (var cc = 0; cc < WIDTH; cc++) {
        var cell = cells[cc];
        if (cell.t < 1) cell.t = Math.min(1, (nowMs - cell.start) / FLIP_MS);
        var e = easeInOut(cell.t);
        var cx = cx0 + cc * colSpacing;

        if (cell.t >= 1 || cell.from === cell.to) {
          drawGlyph(cx, cy, cell.to, glyph, 1);
        } else {
          // cross-fade: outgoing shrinks out, incoming grows in
          drawGlyph(cx, cy, cell.from, glyph, 1 - e);
          drawGlyph(cx, cy, cell.to, glyph, e);
        }
      }
    }

    if (m !== lastSR) {
      lastSR = m;
      sr.textContent = pad2(h) + ':' + pad2(m) + ' local time, in balanced ternary.';
    }
  }

  var rafId = null;
  function loop() { tick(); rafId = requestAnimationFrame(loop); }
  function start() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    else if (!rafId) { rafId = requestAnimationFrame(loop); }
  });

  // brief read-it caption: shown on load, again on tap or key, fading after a pause
  var legend = document.getElementById('legend');
  var legendTimer = null;
  function flashLegend() {
    if (!legend) return;
    legend.classList.add('show');
    if (legendTimer) clearTimeout(legendTimer);
    legendTimer = setTimeout(function () { legend.classList.remove('show'); }, 5000);
  }
  document.addEventListener('pointerup', function (e) {
    if (e.target.closest && e.target.closest('a')) return;
    flashLegend();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flashLegend(); }
  });
  if (window.self === window.top) flashLegend();  // standalone only, not in gallery embeds

  resize();
  start();
})();
</script>
<script>window.aboutClock = {
  title: 'Balanced Ternary',
  board: { label: 'Ciphers', href: '/clocks/numerals/' },
  body: '<p>Balanced ternary uses three digits, minus one, zero, and plus one, so the sign is baked into the number. Here an up triangle is +1, a down triangle is -1, and a short dash is 0.</p>'
      + '<p>Each row is five trits with place values 81, 27, 9, 3, and 1, which is plenty to describe any hour, minute, or second you will meet in a day. Add the ups, subtract the downs, and you get the familiar value at the left.</p>'
      + '<p>The down triangle being -1 feels emotionally accurate, it is the mathematical symbol for “I was doing fine until you asked me to do arithmetic at 2 AM”.</p>'
      + '<p class="about-map"><a href="https://en.wikipedia.org/wiki/Balanced_ternary" target="_blank" rel="noopener">Balanced ternary</a></p>'
};</script>

      '<div class="about-foot">' +
        '<a class="about-board" href="/clocks/">all clocks</a>' +
        '<a href="https://datapoems.io">data poems</a>' +
        '<a href="https://lukesteuber.com">about me</a>' +
      '</div>';
    card.querySelector('h2').textContent = cfg.title || 'About this clock';
    var bodyEl = card.querySelector('.about-body');
    // cfg.pages (array of HTML strings) => a horizontal snap-scroll sequence with
    // dots, so a long modal becomes a few swipeable pages. cfg.body => one column.
    if (cfg.pages && cfg.pages.length) {
      var phtml = '<div class="about-pages">';
      for (var pi = 0; pi < cfg.pages.length; pi++) phtml += '<div class="about-page">' + cfg.pages[pi] + '</div>';
      bodyEl.innerHTML = phtml + '</div><div class="about-dots"></div>';
      var pagesEl = bodyEl.querySelector('.about-pages');
      var dotsEl = bodyEl.querySelector('.about-dots');
      cfg.pages.forEach(function (_, idx) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'about-dot' + (idx === 0 ? ' on' : '');
        dot.setAttribute('aria-label', 'Page ' + (idx + 1));
        dot.addEventListener('click', function () {
          pagesEl.scrollTo({ left: idx * pagesEl.clientWidth, behavior: 'smooth' });
        });
        dotsEl.appendChild(dot);
      });
      pagesEl.addEventListener('scroll', function () {
        var idx = Math.round(pagesEl.scrollLeft / Math.max(1, pagesEl.clientWidth));
        for (var k = 0; k < dotsEl.children.length; k++) {
          dotsEl.children[k].className = 'about-dot' + (k === idx ? ' on' : '');
        }
      }, { passive: true });
    } else {
      bodyEl.innerHTML = cfg.body;
    }
    // Optional per-clock board link, e.g. { label: 'Ciphers', href: '/clocks/numerals/' }.
    var boardLink = card.querySelector('.about-board');
    if (cfg.board && cfg.board.href) {
      boardLink.setAttribute('href', cfg.board.href);
      boardLink.textContent = cfg.board.label || 'back';
    }

    backdrop.appendChild(card);
    document.body.appendChild(backdrop);

    var closeBtn = card.querySelector('.about-close');
    var lastFocus = null;

    function focusables() {
      return Array.prototype.slice.call(
        card.querySelectorAll('a[href], button:not([disabled])')
      );
    }

    function open() {
      lastFocus = document.activeElement;
      backdrop.hidden = false;
      // force reflow so the opacity transition runs
      void backdrop.offsetWidth;
      backdrop.setAttribute('data-open', '');
      card.focus();
      document.addEventListener('keydown', onKey, true);
    }

    function close() {
      backdrop.removeAttribute('data-open');
      document.removeEventListener('keydown', onKey, true);
      setTimeout(function () { backdrop.hidden = true; }, 200);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key === 'Tab') {
        var f = focusables();
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault(); first.focus();
        }
      }
    }

    backdrop.addEventListener('click', function (e) {
      if (e.target === backdrop) close();
    });
    closeBtn.addEventListener('click', close);

    // upgrade the "?" trigger to open the dialog (keep href as fallback).
    // Relabel it: the original markup often labelled this control for its old
    // job (a link to the gallery or my site), which is now misleading once it
    // opens the explainer dialog. Name it for what it actually does.
    trigger.setAttribute('role', 'button');
    trigger.setAttribute('aria-haspopup', 'dialog');
    trigger.setAttribute('aria-label', cfg.title ? 'About the ' + cfg.title + ' clock' : 'About this clock');
    trigger.addEventListener('click', function (e) {
      e.preventDefault();
      open();
    });
  });
})();
</script>
