<body>
  <canvas id="scene" role="img"
    aria-label="The current local time in Yautja (Predator) numerals. The hour, minute and second are each two digits, and every digit is struck as that many glowing angled dashes, the bio-helmet script of the hunters; zero is a single dot. The exact time is shown beneath and announced once a minute."></canvas>
  <div class="sr-only" id="sr" aria-live="polite">Loading clock.</div>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var sr = document.getElementById('sr');
  var embedded = (window.self !== window.top);
  var ACCENT = '#f5b441';
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  var DPR = 1, W = 0, H = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { requestAnimationFrame(resize); });

  // one digit: `d` glowing angled dashes stacked in a column; zero is a single dot.
  function digit(cx, cy, d, u, lw) {
    ctx.strokeStyle = ACCENT; ctx.lineCap = 'round'; ctx.lineWidth = lw;
    ctx.shadowColor = 'rgba(245,180,65,0.7)'; ctx.shadowBlur = u * 0.4;
    if (d === 0) {
      ctx.fillStyle = ACCENT;
      ctx.beginPath(); ctx.arc(cx, cy, lw * 0.9, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; return;
    }
    var rows = Math.min(d, 5), cols = d > 5 ? 2 : 1;
    var dh = u * 0.3, dw = u * 0.5, lean = u * 0.12;
    var n = 0;
    for (var c = 0; c < cols && n < d; c++) {
      var x = cx + (cols === 2 ? (c - 0.5) * u * 0.62 : 0);
      var cnt = (c === 0) ? Math.min(d, 5) : d - 5;
      for (var i = 0; i < cnt; i++) {
        var y = cy - (cnt - 1) * dh / 2 + i * dh;
        ctx.beginPath(); ctx.moveTo(x - dw / 2, y + lean); ctx.lineTo(x + dw / 2, y - lean); ctx.stroke();
        n++;
      }
    }
    ctx.shadowBlur = 0;
  }

  var lastSR = -1;
  function tick() {
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    ctx.fillStyle = '#0a0702'; ctx.fillRect(0, 0, W, H);

    var digs = [Math.floor(h/10), h%10, Math.floor(m/10), m%10, Math.floor(s/10), s%10];
    var readout = pad2(h) + ' : ' + pad2(m) + ' : ' + pad2(s);
    ctx.fillStyle = 'rgba(255,240,212,0.42)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    if (H > W * 1.05) {
      // portrait: three stacked rows, hours over minutes over seconds
      var u = Math.min(W * 0.2, H * 0.115);
      var colGap = u * 1.6, rowGap = u * 2.5, cx = W / 2;
      var cyMid = H / 2 - (embedded ? u * 0.1 : u * 0.8);
      var lw = Math.max(2.5, u * 0.1);
      for (var r = 0; r < 3; r++) {
        var y = cyMid + (r - 1) * rowGap;
        digit(cx - colGap / 2, y, digs[r * 2], u, lw);
        digit(cx + colGap / 2, y, digs[r * 2 + 1], u, lw);
      }
      if (!embedded) {
        ctx.font = '600 ' + Math.max(13, Math.round(u * 0.32)) + 'px "JetBrains Mono", monospace';
        ctx.fillText(readout, cx, cyMid + rowGap + u * 1.5);
      }
    } else {
      // landscape: one row of six digits
      var u = Math.min(W * 0.085, H * 0.26);
      var cell = u * 0.95, gap = u * 0.7;
      var totalW = 6 * cell + 2 * gap;
      var x = W / 2 - totalW / 2 + cell / 2;
      var cy = H / 2 - (embedded ? 0 : u * 0.55);
      var lw = Math.max(2.5, u * 0.1);
      for (var i = 0; i < 6; i++) {
        digit(x, cy, digs[i], u, lw);
        x += cell;
        if (i === 1 || i === 3) x += gap;
      }
      if (!embedded) {
        ctx.font = '600 ' + Math.max(13, Math.round(u * 0.36)) + 'px "JetBrains Mono", monospace';
        ctx.fillText(readout, W / 2, cy + u * 1.35);
      }
    }

    if (m !== lastSR) { lastSR = m; sr.textContent = pad2(h) + ':' + pad2(m) + ' local time, in Yautja numerals.'; }
    requestAnimationFrame(tick);
  }
  resize(); tick();
})();
</script>
<script>window.aboutClock = {

  body: '<p>The Yautja, the dreadlocked alien hunters of the Predator films, carry their own script, glowing dash-marks on their bio-helmets and gauntlets. This clock writes the time in that style.</p>'
      + '<p>Each digit is struck as that many angled glowing dashes, stacked, with a single dot for zero. Six digits give the hours, minutes and seconds; the plain time reads underneath.</p>'
      + '<p>The hunters’ numerals work in tens like ours, but they tally rather than use ten separate signs, so a number is simply how many marks you count.</p>'
